<script>/* 打开页面时停在最上方（无 #锚点 时） */
(function(){
  try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}
  function toTop(){
    if (location.hash) return;
    var de = document.documentElement;
    var prev = de.style.scrollBehavior;
    de.style.scrollBehavior = 'auto';
    window.scrollTo(0, 0);
    de.style.scrollBehavior = prev;
  }
  document.addEventListener('DOMContentLoaded', function(){ toTop(); });
  window.addEventListener('pageshow', function(){ toTop(); });
  window.addEventListener('load', function(){ toTop(); setTimeout(toTop, 60); });
})();</script>

<script>
(function () {
  var modal = document.getElementById("pig-avatar");
  if (!modal) return;
  var img = modal.querySelector("img");
  var name = modal.querySelector("p");
  document.addEventListener("click", function (event) {
    var trigger = event.target.closest(".member-link");
    if (trigger && trigger.dataset.photo) {
      img.src = trigger.dataset.photo;
      img.alt = (trigger.dataset.name || "") + " 的头像";
      name.textContent = trigger.dataset.name || "";
      modal.hidden = false;
      return;
    }
    if (!event.target.closest(".pig-avatar-box")) modal.hidden = true;
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") modal.hidden = true;
  });
})();
</script>
