<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打赏 · 肘家班</title>
<meta name="description" content="给肘家班打赏。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="page.css">
<style>
  .tip-hero {
    margin: 8px 0 0;
    padding: 40px 28px;
    max-width: 620px;
    border-radius: 22px;
    background: #f5f8fd;
    border: 1px solid #e3ecfb;
    text-align: center;
  }
  .tip-qrs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    margin: 0 0 22px;
  }
  .tip-hint {
    margin: 2px 0 0;
    max-width: 260px;
    font-size: 12px;
    line-height: 1.7;
    color: #8a9099;
    text-align: center;
  }
  .tip-qr {
    image-rendering: -webkit-optimize-contrast;
  }
  @media (max-width: 640px) {
    .tip-qrs { grid-template-columns: 1fr; gap: 26px; }
    .tip-qr { max-width: 74vw; margin-inline: auto; }
  }
  .tip-item { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .tip-qr {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    border-radius: 14px;
    background: #ffffff;
    border: 1px solid #e8eef7;
    box-shadow: 0 14px 30px rgba(0, 40, 120, 0.13);
  }
  .tip-name { font-size: 1.05rem; font-weight: 800; letter-spacing: 0.06em; }
  .tip-name--wx { color: #07c160; }
  .tip-name--ali { color: #1677ff; }
  .tip-line { margin: 0 0 8px; font-size: 1rem; line-height: 1.9; color: #1d1d1f; }
  .tip-sub { margin: 0; font-size: 0.9rem; line-height: 1.95; color: #6b7078; text-align: center; }
  .tip-sub .member-link {
    padding: 0;
    border: 0;
    background: none;
    color: #0071e3;
    font: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .tip-sub .member-link:hover { color: #0058b0; }
  .pig-avatar {
    position: fixed;
    inset: 0;
    z-index: 120;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(3px);
  }
  .pig-avatar[hidden] { display: none; }
  .pig-avatar-box {
    margin: 0;
    width: min(320px, 82vw);
    border-radius: 22px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.42);
  }
  .pig-avatar-box img { display: block; width: 100%; height: auto; }
  .pig-avatar-box figcaption {
    padding: 14px 16px 16px;
    text-align: center;
    font-size: 0.95rem;
    font-weight: 600;
    color: #1d1d1f;
  }
  .tip-wechat {
    margin: 14px 0 0;
    font-size: 0.95rem;
    line-height: 1.9;
    color: #1d1d1f;
  }
  .tip-wechat b {
    color: #0071e3;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .tip-wechat-copy {
    padding: 0;
    border: 0;
    background: none;
    color: #0071e3;
    font: inherit;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .tip-wechat-copy:hover { color: #0058b0; }
  .tip-toast {
    position: fixed;
    left: 50%;
    bottom: 42px;
    transform: translate(-50%, 12px);
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.86);
    color: #fff;
    font-size: 0.86rem;
    line-height: 1;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 200;
  }
  .tip-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .tip-back {
    display: inline-block;
    margin-top: 28px;
    color: #0071e3;
    font-size: 0.92rem;
    text-decoration: none;
  }
  .tip-back:hover { text-decoration: underline; }
</style>
<script>try{if(localStorage.getItem("zjban.lang")==="en"||/[?&]lang=en/.test(location.search))document.documentElement.classList.add("lang-en");}catch(e){}</script>
<script>/* 打开页面时停在最上方（无 #锚点 时） */
(function(){
  try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}
  function toTop(){
    if (location.hash) return;
    var de = document.documentElement;
    var prev = de.style.scrollBehavior;
    de.style.scrollBehavior = 'auto';
    window.scrollTo(0, 0);
    de.style.scrollBehavior = prev;
  }
  document.addEventListener('DOMContentLoaded', function(){ toTop(); });
  window.addEventListener('pageshow', function(){ toTop(); });
  window.addEventListener('load', function(){ toTop(); setTimeout(toTop, 60); });
})();</script>
</head>
<body>

<header class="top">
  <div class="top-inner shell">
    <a class="mark" href="index.html">肘家班</a>
    <nav class="nav">
      <a href="index.html#story">我们的故事</a>
      <a href="index.html#people">成员</a>
      <a href="index.html#map">成员分布</a>
    </nav>
  </div>
</header>

<main class="shell" style="padding: 48px 0 96px;">
  <h1>打赏</h1>
  <div class="tip-hero">
    <div class="tip-qrs">
      <figure class="tip-item">
        <img class="tip-qr" src="reward-qr.png" alt="微信收款二维码" decoding="async" loading="lazy">
        <figcaption class="tip-name tip-name--wx">微信</figcaption>
        <p class="tip-hint">长按保存图片，再用「微信 → 扫一扫 → 相册」选择它<br>（微信不支持长按识别收款码）</p>
      </figure>
      <figure class="tip-item">
        <img class="tip-qr" src="reward-alipay.png" alt="支付宝收款二维码" decoding="async" loading="lazy">
        <figcaption class="tip-name tip-name--ali">支付宝</figcaption>
      </figure>
    </div>
    <p class="tip-line">如果您觉得肘家班的故事有点意思，或者觉得这个网站做得不错，<br>可以请我们喝一瓶冰可乐。</p>
    <p class="tip-sub">金额随意，全凭心意。您的鼓励就是我继续做下去的动力。我代表肘家班全体成员感谢您的浏览与支持！<br>如果打赏，请备注您的名字，<button class="member-link" type="button" data-photo="member-lvao.webp?v=3" data-name="吕奥">肘家班创始人兼网站制作者</button>会亲自给您发微信致谢。</p>
    <p class="tip-wechat">我的微信：<button class="tip-wechat-copy" type="button" data-copy="Lvao710710710" aria-label="复制微信号">Lvao710710710</button></p>
  </div>
  <a class="tip-back" href="index.html">← 回到首页</a>
    <a class="back back-bottom" href="index.html#story">← 返回我们的故事</a>
</main>

<footer class="shell">
  <p>肘家班</p>
</footer>

<div class="tip-toast" id="tip-toast" role="status" aria-live="polite">微信号已复制</div>
<div class="pig-avatar" id="pig-avatar" hidden>
  <figure class="pig-avatar-box">
    <img alt="" decoding="async" loading="lazy">
    <figcaption></figcaption>
  </figure>
</div>
<script>
(function () {
  var modal = document.getElementById("pig-avatar");
  var img = modal.querySelector("img");
  var cap = modal.querySelector("figcaption");
  document.addEventListener("click", function (e) {
    var link = e.target.closest(".member-link");
    if (link) {
      img.src = link.getAttribute("data-photo");
      img.alt = link.getAttribute("data-name");
      cap.textContent = link.getAttribute("data-name");
      modal.hidden = false;
      e.stopPropagation();
      return;
    }
    if (e.target === modal) modal.hidden = true;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") modal.hidden = true;
  });
})();
</script>
<script>
(function () {
  var toast = document.getElementById("tip-toast");
  var timer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(function () { toast.classList.remove("show"); }, 1600);
  }
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast("微信号已复制"); })
        .catch(function () { fallback(text); });
    } else { fallback(text); }
  }
  function fallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast("微信号已复制"); }
    catch (e) { showToast("复制失败，请手动选择"); }
    document.body.removeChild(ta);
  }
  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".tip-wechat-copy");
    if (btn) { copy(btn.getAttribute("data-copy")); e.stopPropagation(); }
  });
})();
</script>
<script src="zoom.js" defer></script>
<script src="exit-intent.js" defer></script>
  <script src="lang.js" defer></script>
