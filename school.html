<script>
(function () {
  var modal = document.getElementById("pig-avatar");
  if (!modal) return;
  var img = modal.querySelector("img");
  var cap = modal.querySelector("figcaption");
  document.addEventListener("click", function (event) {
    var link = event.target.closest(".member-link");
    if (link) {
      img.src = link.getAttribute("data-photo");
      img.alt = link.getAttribute("data-name");
      cap.textContent = link.getAttribute("data-name");
      modal.hidden = false;
      return;
    }
    if (!modal.hidden) modal.hidden = true;
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") modal.hidden = true;
  });
})();
</script>
