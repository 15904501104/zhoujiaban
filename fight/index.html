<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>周家班 · 街霸对决</title>
<style>
  :root{--ink:#0b0d12;--line:#2c3242;--hot:#ffd23f;--p1:#3ea6ff;--p2:#ff5d6c;}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#05070c;color:#e9eef7;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;
    background:#000;box-shadow:0 0 0 1px #1b2230,0 20px 60px rgba(0,0,0,.6)}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;font-weight:800;letter-spacing:.5px}
  .bar{position:absolute;top:3.2%;height:3.4%;background:#101522;border:2px solid #2b3446;
    border-radius:2px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.5)}
  .bar>i{position:absolute;inset:0;transform-origin:left center;transition:transform .12s linear}
  #bar1{left:2.2%;width:38%}
  #bar1>i{background:linear-gradient(180deg,#8ee9ff,#2ea6ff 55%,#1668c9)}
  #bar2{right:2.2%;width:38%}
  #bar2>i{background:linear-gradient(180deg,#ffb3bb,#ff5d6c 55%,#c22b3c);
    transform-origin:right center}
  #bar1::after,#bar2::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 2px,transparent 2px 6px);opacity:.35}
  .pname{position:absolute;top:7.3%;font-size:1.55vmin;color:#cfd8e6;text-shadow:0 1px 0 #000}
  #n1{left:2.4%}
  #n2{right:2.4%;text-align:right}
  #timer{position:absolute;top:2.6%;left:50%;transform:translateX(-50%);
    font-size:3.4vmin;color:#fff;text-shadow:0 2px 0 #000,0 0 12px rgba(255,210,63,.5)}
  #pips{position:absolute;top:11%;left:50%;transform:translateX(-50%);display:flex;gap:1.2vmin}
  .pip{width:1.5vmin;height:1.5vmin;border-radius:50%;background:#1a2130;border:2px solid #39445a}
  .pip.on{background:var(--hot);border-color:#fff3b0;box-shadow:0 0 10px rgba(255,210,63,.8)}
  #roundmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9vmin;color:#fff;text-shadow:0 4px 0 #000,0 0 30px rgba(255,190,50,.8);
    opacity:0;transition:opacity .18s;letter-spacing:1vmin}
  #roundmsg.show{opacity:1}

  /* ---------- 覆盖层 ---------- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:2.4vmin;background:radial-gradient(120% 100% at 50% 0,#131a2a,#05070c 70%)}
  .screen.on{display:flex}
  h1{margin:0;font-size:7.2vmin;letter-spacing:.6vmin;
    background:linear-gradient(180deg,#fff,#ffd23f 55%,#e08a00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.55))}
  .sub{font-size:1.9vmin;color:#93a2bb;letter-spacing:.3vmin}
  .keys{display:flex;gap:3vmin;font-size:1.7vmin;color:#aab7cc;line-height:1.9}
  .keys b{color:var(--hot)}
  .hint{font-size:2vmin;color:#fff;animation:blink 1.1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.25}}

  /* 选人 */
  #sel .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1vmin;width:76%}
  .cell{position:relative;background:#0e1420;border:2px solid #232c3d;border-radius:4px;
    padding:.6vmin;display:flex;flex-direction:column;align-items:center;gap:.3vmin}
  .cell canvas{position:static;width:100%;height:auto;image-rendering:pixelated}
  .cell span{font-size:1.35vmin;color:#c7d2e3}
  .cell .pick{position:absolute;inset:-2px;border:3px solid transparent;border-radius:5px}
  .cell.p1 .pick{border-color:var(--p1);box-shadow:0 0 14px rgba(62,166,255,.75)}
  .cell.p2 .pick{border-color:var(--p2);box-shadow:0 0 14px rgba(255,93,108,.75)}
  .cell.cur1{outline:3px solid var(--p1);outline-offset:2px}
  .cell.cur2{outline:3px solid var(--p2);outline-offset:2px}
  .cell.p1.p2 .pick{border-color:var(--hot);box-shadow:0 0 16px rgba(255,210,63,.8)}
  #selinfo{display:flex;gap:4vmin;font-size:1.8vmin;color:#cfd8e6}
  #selinfo .who{min-width:22vmin}
  #selinfo .who b{color:var(--hot)}
  .stat{display:flex;gap:.6vmin;align-items:center}

  /* 结算 */
  #over .winner{font-size:5.4vmin;color:#fff;text-shadow:0 3px 0 #000}
  #over .face{width:26vmin;image-rendering:pixelated;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
  #over .wsub{font-size:2.2vmin;color:#9fb0c8}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="1440" height="810"></canvas>

  <div id="hud">
    <div class="bar" id="bar1"><i></i></div>
    <div class="bar" id="bar2"><i></i></div>
    <div class="pname" id="n1">P1</div>
    <div class="pname" id="n2">P2</div>
    <div id="timer">60</div>
    <div id="pips"></div>
    <div id="roundmsg"></div>
  </div>

  <!-- 标题 -->
  <div class="screen on" id="title">
    <h1>周家班 · 街霸对决</h1>
    <div class="sub">ZHOU JIA BAN — PIXEL FIGHTER</div>
    <div class="keys">
      <div><b>P1</b> 移动 A / D　跳 W　格挡 S　拳 F　腿 G</div>
      <div><b>P2</b> 移动 ← / →　跳 ↑　格挡 ↓　拳 K　腿 L</div>
    </div>
    <div class="hint">按 <b>J</b> 或 <b>K</b> 开始</div>
  </div>

  <!-- 选人 -->
  <div class="screen" id="sel">
    <h1 style="font-size:4.4vmin">选择人物</h1>
    <div class="grid" id="grid"></div>
    <div id="selinfo">
      <div class="who" id="who1">P1：<b>—</b></div>
      <div class="who" id="who2">P2：<b>—</b></div>
    </div>
    <div class="sub">P1：A/D 选　F 确认　　P2：←/→ 选　K 确认　（先 P1 后 P2）</div>
  </div>

  <!-- 结算 -->
  <div class="screen" id="over">
    <div class="winner" id="winText">P1 胜</div>
    <img class="face" id="winFace" alt="">
    <div class="wsub" id="winName">—</div>
    <div class="hint">按 <b>J</b> 再打一局　按 <b>K</b> 回到选人</div>
  </div>
</div></div>

<script>
(() => {
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ================= 世界参数 ================= */
const W = 480, H = 270;          // 逻辑像素
const SCALE = cv.width / W;       // 3
const GROUND = 246;               // 地面 y（脚底）
const WALL_L = 26, WALL_R = W - 26;

/* ================= 角色表 ================= */
const ROSTER = [
  { id:'lvao',        name:'吕奥',    hp:100, spd:1.85, pow:1.05, reach:1.15, skin:'#e2b898', tag:'抽烟的' },
  { id:'zhuxingchi',  name:'朱星驰',  hp:105, spd:1.70, pow:1.15, reach:1.05, skin:'#efd7c6', tag:'耳钉' },
  { id:'zhanghuan',   name:'张桓',    hp:110, spd:1.60, pow:1.20, reach:1.00, skin:'#b08062', tag:'Levi\'s' },
  { id:'zhoujiacong', name:'周佳聪',  hp:100, spd:1.75, pow:0.95, reach:1.10, skin:'#e6b795', tag:'记录员' },
  { id:'wangzheyu',   name:'王者禹',  hp:100, spd:1.65, pow:1.10, reach:1.05, skin:'#c69a7a', tag:'眼镜' },
  { id:'caoyuhuan',   name:'曹宇桓',  hp:125, spd:1.35, pow:1.30, reach:1.05, skin:'#e8bc9a', tag:'猪' },
  { id:'zhanghao',    name:'张昊',    hp:100, spd:1.75, pow:1.00, reach:1.10, skin:'#f2d0b6', tag:'绿鞋' },
  { id:'wangyuanquan',name:'王源泉',  hp:105, spd:1.65, pow:1.05, reach:1.05, skin:'#f0d0b8', tag:'卫衣' },
  { id:'wangzhenheng',name:'王振蘅',  hp:95,  spd:1.95, pow:0.90, reach:0.95, skin:'#c69a7a', tag:'矮小' },
  { id:'songjunhao',  name:'宋君昊',  hp:100, spd:1.70, pow:1.05, reach:1.10, skin:'#dcb69a', tag:'白T' },
  { id:'zhihaibo',    name:'只海博',  hp:100, spd:1.70, pow:1.05, reach:1.10, skin:'#f6d6c4', tag:'西装' },
  { id:'langhongze',  name:'郎宏泽',  hp:105, spd:1.65, pow:1.10, reach:1.05, skin:'#eec8a8', tag:'口罩' },
];

/* ================= 资源 ================= */
const IMG = {};
/* 吕奥：逐帧动画（gen_lvao_frames.py 生成） */
const ANIM = {
  lvao: { w:96, h:120, sheets:{}, frames:{ idle:2, walk:4, jump:2, punch:4, kick:4, hurt:1, block:1 } }
};
function loadAnims(){
  for(const id in ANIM){
    const a = ANIM[id];
    for(const name in a.frames){
      const im = new Image();
      im.src = `frames/${id}/${name}.png`;
      a.sheets[name] = im;
    }
  }
}
loadAnims();
let assetsReady = false;
function loadAssets(){
  let n = 0, total = ROSTER.length;
  ROSTER.forEach(c => {
    const im = new Image();
    im.onload = () => { if(++n === total) assetsReady = true; };
    im.onerror = () => { if(++n === total) assetsReady = true; };
    im.src = 'sprites/' + c.id + '.png';
    IMG[c.id] = im;
  });
}
loadAssets();

/* 调试：?sel 直接进选人，?fight 直接开打 */
const DBG = new URLSearchParams(location.search);
function debugJump(){
  if(DBG.has('over')){
    const w = DBG.get('over') === '2' ? 1 : 0;
    ARENA.wins = w ? [0,2] : [2,0];
    sel.p1 = +(DBG.get('p1') || 0); sel.p2 = +(DBG.get('p2') || 2);
    scene = SC.OVER;
    el('winText').textContent = w ? 'P2 获胜' : 'P1 获胜';
    el('winFace').src = 'sprites/' + ROSTER[w ? sel.p2 : sel.p1].id + '.png';
    el('winName').textContent = ROSTER[w ? sel.p2 : sel.p1].name;
    showScreen('over'); el('hud').style.display = 'none';
    return;
  }
  if(DBG.has('sel')){ scene = SC.SELECT; showScreen('sel'); buildGrid(); refreshSel(); }
  if(DBG.has('fight')){
    sel.p1 = +(DBG.get('p1') || 0);
    sel.p2 = +(DBG.get('p2') || 2);
    sel.done1 = sel.done2 = true;
    startMatch();
    if(DBG.has('hp')){
      const v = +(DBG.get('hp')||30);
      ARENA.fighters.forEach(f => { f.hp = f.maxhp = v; });
      updateHUD(true);
    }
    if(DBG.has('sim')) setTimeout(() => runSim(+(DBG.get('sim')) || 120), 60);
  }
}
setTimeout(() => { if(assetsReady) debugJump(); else setTimeout(debugJump, 400); }, 120);

/* 调试：?sim=帧数 —— 同步跑帧，用于自动截图验证 */
function runSim(frames){
  ARENA.freeze = 0; ARENA.msg = 0;
  el('roundmsg').classList.remove('show');
  el('roundmsg').style.opacity = 0;
  for(let i=0;i<frames;i++){
    keys['d'] = (i % 80) < 52;                 // P1 反复靠近
    keys['a'] = false;
    keys['f'] = i > 40 && (i % 30) < 3;        // 出拳
    keys['g'] = i > 40 && (i % 74) >= 66;      // 偶尔踢腿
    keys['arrowleft'] = (i % 96) < 46;         // P2 也靠近
    keys['arrowright'] = false;
    keys['s'] = (i % 110) > 92;                // 偶尔格挡
    update(1/60);
  }
  keys['a']=keys['d']=keys['f']=keys['g']=keys['arrowleft']=keys['arrowright']=keys['s']=false;
  ARENA.freeze = 9999;
  const A=ARENA.fighters[0], B=ARENA.fighters[1];
  document.title = JSON.stringify({st:A.state, tt:A.attack?Math.round(A.attack.tt):null,
    x1:Math.round(A.x), x2:Math.round(B.x), hp1:A.hp, hp2:B.hp, wins:ARENA.wins});
}

/* ================= 输入 ================= */
const keys = {};
const PRESSED = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(!keys[k]) PRESSED[k] = true;
  keys[k] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function consume(k){ if(PRESSED[k]){ PRESSED[k]=false; return true; } return false; }

/* ================= 音效（WebAudio 简易） ================= */
let AC = null;
function beep(freq, dur=0.08, type='square', vol=0.05){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur + 0.02);
  }catch(e){}
}

/* ================= 场景 ================= */
const SC = { TITLE:0, SELECT:1, FIGHT:2, OVER:3 };
let scene = SC.TITLE;

const el = id => document.getElementById(id);
const screens = { title: el('title'), sel: el('sel'), over: el('over') };
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('on'));
  if(name) screens[name].classList.add('on');
  el('hud').style.display = (name === null) ? 'block' : ((name === 'over') ? 'block' : 'none');
}
showScreen('title');

/* ================= 选人 ================= */
const sel = { p1:0, p2:6, stage:0, done1:false, done2:false };
function buildGrid(){
  const g = el('grid'); g.innerHTML = '';
  ROSTER.forEach((c, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell'; cell.dataset.i = i;
    const cvs = document.createElement('canvas');
    cvs.width = 96; cvs.height = 120;
    const c2 = cvs.getContext('2d');
    c2.imageSmoothingEnabled = false;
    const im = IMG[c.id];
    if(im && im.complete && im.naturalWidth) c2.drawImage(im, 0, 0, 96, 120);
    const sp = document.createElement('span'); sp.textContent = c.name;
    const pick = document.createElement('div'); pick.className = 'pick';
    cell.append(cvs, sp, pick);
    g.append(cell);
  });
}
function refreshSel(){
  [...el('grid').children].forEach((cell, i) => {
    cell.classList.toggle('cur1', i === sel.p1 && !sel.done1);
    cell.classList.toggle('cur2', i === sel.p2 && !sel.done2);
    cell.classList.toggle('p1', sel.done1 && i === sel.p1);
    cell.classList.toggle('p2', sel.done2 && i === sel.p2);
  });
  el('who1').innerHTML = 'P1：<b>' + (sel.done1 ? ROSTER[sel.p1].name : '选择中…') + '</b>';
  el('who2').innerHTML = 'P2：<b>' + (sel.done2 ? ROSTER[sel.p2].name : '选择中…') + '</b>';
}


/* ================= 像素骨骼（分部件动画） ================= */
/* 每个部件：sx,sy,sw,sh = 精灵图里的矩形；px,py = 旋转轴（精灵图坐标） */
const RIGS = {
  lvao: {
    img: null,
    parts: [
      { id:'legL', sx:34, sy:94, sw:12, sh:26, px:40, py:97, cap:5, col:[66,94,140] },
      { id:'legR', sx:51, sy:94, sw:12, sh:26, px:55, py:97, cap:5, col:[66,94,140] },
      { id:'torso',sx:30, sy:56, sw:36, sh:42, px:48, py:96 },
      { id:'armL', sx:32, sy:58, sw:6,  sh:34, px:37, py:61, cap:4, col:[198,154,124] },
      { id:'head', sx:28, sy:0,  sw:40, sh:58, px:48, py:57 },
      { id:'armR', sx:58, sy:58, sw:6,  sh:34, px:58, py:61, cap:4, col:[226,184,152] },
    ]
  }
};

function animFrame(f){
  const a = ANIM[f.cfg.id]; if(!a) return null;
  const st = f.state;
  let name = st, idx = 0;
  if(st === 'idle'){ name='idle'; idx = Math.floor(f.t/6)%2; }
  else if(st === 'walk'){ name='walk'; idx = Math.floor(f.t/4)%4; }
  else if(st === 'jump'){ name='jump'; idx = f.vy < 0 ? 0 : 1; }
  else if(st === 'hurt'){ name='hurt'; idx=0; }
  else if(st === 'block'){ name='block'; idx=0; }
  else if(st === 'attack' && f.attack){
    const tt = f.attack.tt || 0;
    if(f.attack.kind === 'punch'){ name='punch'; idx = tt<4?0:(tt<8?1:(tt<12?2:3)); }
    else { name='kick'; idx = tt<6?0:(tt<11?1:(tt<16?2:3)); }
  } else if(st === 'ko'){ return null; }
  else { name='idle'; idx=0; }
  const sheet = a.sheets[name];
  if(!sheet || !sheet.complete) return null;
  return { sheet, sx: idx*a.w, w: a.w, h: a.h };
}

function drawAnim(g, f){
  const fr = animFrame(f); if(!fr) return false;
  g.save();
  g.translate(f.x, GROUND - f.y);
  g.globalAlpha = .35; g.fillStyle = '#000';
  g.beginPath(); g.ellipse(0, 0, 20, 5, 0, 0, Math.PI*2); g.fill();
  g.globalAlpha = 1;
  if(f.face < 0) g.scale(-1, 1);
  g.drawImage(fr.sheet, fr.sx, 0, fr.w, fr.h, -fr.w/2, -fr.h, fr.w, fr.h);
  g.restore();
  return true;
}

function poseFor(id, f){
  const st = f.state, t = f.t, p = {};
  const A = (a)=>a*Math.PI/180;
  const set = (k, o)=>{ p[k] = Object.assign({a:0,dx:0,dy:0}, o||{}); };

  if(st === 'ko'){ return null; }   // 倒地用整图

  // 默认
  set('head'); set('torso'); set('armL'); set('armR'); set('legL'); set('legR');

  if(st === 'idle'){
    const b = Math.sin(t*3);
    p.torso.dy = b*0.8; p.head.dy = b*0.8;
    p.armL.a = A(-2 + b*1.2); p.armR.a = A(2 - b*1.2);
  } else if(st === 'walk'){
    const s = Math.sin(t*11);
    p.legL.a = A(s*16); p.legR.a = A(-s*16);
    p.armL.a = A(-s*12); p.armR.a = A(s*12);
    p.torso.dy = -Math.abs(s)*1.2; p.head.dy = p.torso.dy;
    p.torso.a = A(-2);
  } else if(st === 'jump'){
    p.legL.a = A(18); p.legR.a = A(-10);
    p.armL.a = A(-35); p.armR.a = A(35);
    p.torso.a = A(-3);
  } else if(st === 'block'){
    p.armL.a = A(-96); p.armR.a = A(96);
    p.armL.dx = 4; p.armR.dx = -4;
    p.torso.a = A(3); p.head.a = A(2);
  } else if(st === 'hurt'){
    p.torso.a = A(9); p.head.a = A(6);
    p.armL.a = A(-24); p.armR.a = A(24);
    p.torso.dx = -2;
  } else if(st === 'attack' && f.attack){
    const k = f.attack.kind, tt = f.attack.tt || 0;
    if(k === 'punch'){
      const wind = tt < 4;
      const ext  = tt < 4 ? tt*3 : (tt < 8 ? (tt-3)*22 : (tt < 11 ? 74 : Math.max(0, 74 - (tt-10)*20)));
      p.armR.a = A(-ext);
      p.armR.dx = tt < 4 ? -2 : (tt < 8 ? 4 : 6);
      p.torso.a = A(ext*0.06);
      p.head.a = A(ext*0.03);
      p.legL.a = A(-4); p.legR.a = A(6);
      p.armL.a = A(10);
    } else {
      const ext = tt < 5 ? tt*10 : (tt < 9 ? 50 : Math.max(0, 50 - (tt-8)*12));
      p.legR.a = A(-ext);
      p.legR.dy = -ext*0.05;
      p.torso.a = A(ext*0.10);
      p.armL.a = A(-18); p.armR.a = A(22);
      p.head.a = A(ext*0.04);
    }
  }
  return p;
}

function drawRig(g, f){
  const rig = RIGS[f.cfg.id];
  const im = IMG[f.cfg.id];
  if(!rig || !im || !im.complete) return false;
  const pose = poseFor(f.cfg.id, f);
  if(!pose) return false;

  const bob = (f.state === 'idle') ? 0 : 0;
  g.save();
  g.translate(f.x, GROUND - f.y - bob);
  g.globalAlpha = .35; g.fillStyle = '#000';
  g.beginPath(); g.ellipse(0, 0, 20, 5, 0, 0, Math.PI*2); g.fill();
  g.globalAlpha = 1;

  if(f.face < 0) g.scale(-1, 1);

  for(const part of rig.parts){
    const tr = pose[part.id]; if(!tr) continue;
    g.save();
    // 轴点（精灵坐标 -> 世界：x-48, y-120）
    g.translate(part.px - 48 + tr.dx, part.py - 120 + tr.dy);
    g.rotate(tr.a);
    g.translate(-(part.px - part.sx), -(part.py - part.sy));
    if(f.flash > 0){ g.globalAlpha = .85; }
    g.drawImage(im, part.sx, part.sy, part.sw, part.sh, 0, 0, part.sw, part.sh);
    g.globalAlpha = 1;
    g.restore();
    if(part.cap){
      g.save();
      g.translate(part.px - 48 + tr.dx, part.py - 120 + tr.dy);
      g.fillStyle = `rgb(${part.col[0]},${part.col[1]},${part.col[2]})`;
      g.beginPath(); g.arc(0,0,part.cap,0,Math.PI*2); g.fill();
      g.restore();
    }
  }
  g.restore();
  return true;
}

/* ================= 战斗 ================= */
const P1KEYS = { left:'a', right:'d', up:'w', down:'s', punch:'f', kick:'g' };
const P2KEYS = { left:'arrowleft', right:'arrowright', up:'arrowup', down:'arrowdown', punch:'k', kick:'l' };

class Fighter {
  constructor(cfg, side){
    this.cfg = cfg; this.side = side;             // -1 left, +1 right
    this.x = side < 0 ? 150 : W - 150;
    this.y = 0;                                    // 离地高度
    this.vx = 0; this.vy = 0;
    this.face = side < 0 ? 1 : -1;
    this.hp = cfg.hp; this.maxhp = cfg.hp;
    this.state = 'idle'; this.t = 0; this.anim = 0;
    this.attack = null; this.hitDone = false;
    this.stun = 0; this.blocking = false; this.grounded = true;
    this.flash = 0;
  }
  get w(){ return 40; }
  get h(){ return 108; }
  get cx(){ return this.x; }
  get cy(){ return GROUND - this.y - this.h/2; }

  canAct(){ return (this.state === 'idle' || this.state === 'walk') && this.stun <= 0; }

  startAttack(kind){
    if(!this.canAct()) return;
    const heavy = kind === 'kick';
    this.state = 'attack'; this.t = 0;
    this.attack = { kind, dur: heavy ? 26 : 16, hit: heavy ? [11,17] : [6,10],
      dmg: Math.round((heavy ? 9 : 5) * this.cfg.pow),
      reach: (heavy ? 34 : 26) * this.cfg.reach,
      kb: heavy ? 3.4 : 1.9 };
    this.hitDone = false;
    beep(heavy ? 180 : 320, .05, 'square', .03);
  }

  update(dt, keyset, opp){
    this.t += dt;
    if(this.flash > 0) this.flash -= dt;
    if(this.stun > 0) this.stun -= dt;

    const K = keyset;
    this.blocking = !!keys[K.down] && this.grounded && this.stun <= 0
                    && (this.state === 'idle' || this.state === 'walk' || this.state === 'block');
    if(this.blocking) this.state = 'block';

    if(this.stun <= 0 && this.state !== 'attack' && this.state !== 'hurt'){
      const dir = (keys[K.right] ? 1 : 0) - (keys[K.left] ? 1 : 0);
      if(dir !== 0 && !this.blocking){
        this.vx = dir * this.cfg.spd;
        this.face = dir;
        if(this.grounded) this.state = 'walk';
      } else {
        this.vx = 0;
        if(this.grounded && !this.blocking) this.state = 'idle';
      }
      if(keys[K.up] && this.grounded && !this.blocking){
        this.vy = 3.9; this.grounded = false; this.state = 'jump';
        beep(520, .06, 'sine', .03);
      }
      if(this.grounded && !this.blocking){
        if(keys[K.punch] && !this.prevPunch) this.startAttack('punch');
        if(keys[K.kick] && !this.prevKick) this.startAttack('kick');
      }
    }
    this.prevPunch = !!keys[K.punch];
    this.prevKick = !!keys[K.kick];

    // 物理
    if(!this.grounded){
      this.vy -= 0.22; this.y += this.vy;
      if(this.y <= 0){ this.y = 0; this.vy = 0; this.grounded = true;
        if(this.state === 'jump') this.state = 'idle'; }
    }
    this.x += this.vx;
    if(this.state === 'attack') this.vx *= 0.5;
    this.x = Math.max(WALL_L, Math.min(WALL_R, this.x));

    // 攻击推进
    if(this.state === 'attack'){
      this.attack.tt = (this.attack.tt || 0) + dt * 60;
      if(this.attack.tt >= this.attack.dur){
        this.state = 'idle'; this.attack = null;
      }
    }
    if(this.state === 'hurt' && this.stun <= 0) this.state = 'idle';
  }

  hitbox(){
    if(this.state !== 'attack' || !this.attack) return null;
    const t = this.attack.tt || 0;
    if(t < this.attack.hit[0] || t > this.attack.hit[1]) return null;
    const w = this.attack.reach;
    return { x: this.x + this.face * (18 + w/2), y: GROUND - this.y - 74,
             w, h: 26 };
  }
  hurtbox(){ return { x:this.x - this.w/2, y: GROUND - this.y - this.h, w:this.w, h:this.h }; }

  takeHit(hit, fromDir){
    const dmg = this.blocking ? Math.max(1, Math.round(hit.dmg * 0.18)) : hit.dmg;
    this.hp = Math.max(0, this.hp - dmg);
    this.flash = 0.12;
    this.stun = this.blocking ? 8 : 14;
    this.state = this.blocking ? 'block' : 'hurt';
    this.vx = fromDir * (this.blocking ? hit.kb * 0.4 : hit.kb);
    beep(this.blocking ? 700 : 120, .07, this.blocking ? 'triangle' : 'sawtooth', .05);
    return dmg;
  }

  drawBody(g){
    if(this.state !== 'ko'){ if(drawAnim(g, this)) return; if(drawRig(g, this)) return; }
    const sx = this.x, sy = GROUND - this.y;
    g.save();
    g.translate(sx, sy);
    g.globalAlpha = .35; g.fillStyle = '#000';
    g.beginPath(); g.ellipse(0, 0, 20, 5, 0, 0, Math.PI*2); g.fill();
    g.globalAlpha = 1;

    if(this.face < 0) g.scale(-1, 1);
    let bob = 0, tilt = 0;
    if(this.state === 'idle') bob = Math.sin(this.t * 4) * 1;
    if(this.state === 'walk') { bob = -Math.abs(Math.sin(this.t * 10)) * 1.5; tilt = -Math.sin(this.t*10)*0.03; }
    if(this.state === 'attack'){ tilt = -0.06; bob = -1; }
    if(this.state === 'hurt'){ tilt = 0.12; }
    if(this.state === 'ko'){
      g.restore(); g.save();
      g.translate(sx, sy - 10); g.rotate(this.face > 0 ? -Math.PI/2 : Math.PI/2);
      g.drawImage(IMG[this.cfg.id], -48, -120, 96, 120);
      g.restore(); return;
    }
    if(this.state === 'block'){ tilt = 0.04; bob = 1; }

    g.rotate(tilt);
    const im = IMG[this.cfg.id];
    if(this.flash > 0) g.globalAlpha = .8;
    if(im && im.complete && im.naturalWidth){
      g.drawImage(im, -48, -120 + bob, 96, 120);
    } else {
      g.fillStyle = '#cfa'; g.fillRect(-24, -110, 48, 110);
    }
    g.globalAlpha = 1;

    if(this.state === 'block'){
      g.strokeStyle = 'rgba(120,200,255,.85)'; g.lineWidth = 3;
      g.beginPath(); g.arc(10, -60, 34, -1.2, 1.2); g.stroke();
    }
    g.restore();
  }

  drawLimb(g){
    if(RIGS[this.cfg.id] || ANIM[this.cfg.id]) return;
    if(this.state !== 'attack' || !this.attack) return;
    const k = this.attack.kind, t = this.attack.tt || 0;
    const phase = Math.min(1, Math.max(0, (t - this.attack.hit[0] + 1) / 3));
    const ext = (k === 'punch' ? 26 : 32) * this.cfg.reach * (phase > 0 ? 1 : Math.min(1, t/6));
    g.save();
    g.translate(this.x, GROUND - this.y);
    if(this.face < 0) g.scale(-1, 1);
    g.fillStyle = this.cfg.skin || '#f2d0b4';
    const y = k === 'punch' ? -70 : -26;
    const h = k === 'punch' ? 9 : 11;
    g.beginPath(); g.roundRect(12, y, 10 + ext, h, h/2); g.fill();
    g.beginPath(); g.arc(22 + ext, y + h/2, h/2 + 1.5, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(0,0,0,.2)';
    g.beginPath(); g.arc(22 + ext, y + h/2, h/2 + 1.5, -0.6, 1.2); g.fill();
    g.restore();
  }

}

const ARENA = { t:0, time:60, round:1, wins:[0,0], fighters:[], msg:0, msgText:'', freeze:0 };

function startMatch(){
  buildFighters();
  ARENA.round = 1; ARENA.wins = [0,0];
  newRound();
}
function buildFighters(){
  ARENA.fighters = [ new Fighter(ROSTER[sel.p1], -1), new Fighter(ROSTER[sel.p2], 1) ];
}
function newRound(){
  buildFighters();
  ARENA.time = 60; ARENA.t = 0; ARENA.msg = 0.9; ARENA.msgText = 'ROUND ' + ARENA.round;
  ARENA.freeze = 1.5;
  setTimeout(() => {
    if(scene !== SC.FIGHT) return;
    ARENA.msgText = 'FIGHT!'; ARENA.msg = 0.6;
    beep(880, .12, 'square', .05);
  }, 950);
  showScreen(null);
  updateHUD(true);
  scene = SC.FIGHT;
}

/* ================= HUD ================= */
function updateHUD(force){
  const f1 = ARENA.fighters[0], f2 = ARENA.fighters[1];
  if(f1) el('n1').textContent = (sel.done1 ? 'P1 · ' : 'P1 · ') + ROSTER[sel.p1].name;
  if(f2) el('n2').textContent = ROSTER[sel.p2].name + ' · P2';
  if(f1) el('bar1').firstElementChild.style.transform = 'scaleX(' + (f1.hp / f1.maxhp) + ')';
  if(f2) el('bar2').firstElementChild.style.transform = 'scaleX(' + (f2.hp / f2.maxhp) + ')';
  el('timer').textContent = Math.ceil(ARENA.time);
  const pips = el('pips');
  if(force || pips.children.length !== 4){
    pips.innerHTML = '';
    for(let i=0;i<2;i++){
      const d=document.createElement('div'); d.className='pip'+(ARENA.wins[0]>i?' on':''); pips.append(d);
    }
    const gap=document.createElement('div'); gap.style.width='2vmin'; pips.append(gap);
    for(let i=0;i<2;i++){
      const d=document.createElement('div'); d.className='pip'+(ARENA.wins[1]>i?' on':''); pips.append(d);
    }
  }
}

/* ================= 特效 ================= */
const FX = [];
function addHitFX(x, y, power){
  for(let i=0;i<8+power*2;i++){
    FX.push({ x, y, vx:(Math.random()-0.5)*3.2, vy:(Math.random()-0.6)*3,
      life:0.35+Math.random()*0.25, max:0.6,
      c: Math.random()<0.5 ? '#ffd23f' : '#fff' });
  }
}

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  if(scene === SC.TITLE){
    if(consume('j') || consume('k')){ scene = SC.SELECT; showScreen('sel'); buildGrid(); refreshSel(); }
    return;
  }
  if(scene === SC.SELECT){
    if(!sel.done1){
      if(consume('a')){ sel.p1 = (sel.p1 + ROSTER.length - 1) % ROSTER.length; beep(660,.04); }
      if(consume('d')){ sel.p1 = (sel.p1 + 1) % ROSTER.length; beep(660,.04); }
      if(consume('f')){ sel.done1 = true; beep(880,.08); }
    } else if(!sel.done2){
      if(consume('arrowleft')){ sel.p2 = (sel.p2 + ROSTER.length - 1) % ROSTER.length; beep(520,.04); }
      if(consume('arrowright')){ sel.p2 = (sel.p2 + 1) % ROSTER.length; beep(520,.04); }
      if(consume('k')){ sel.done2 = true; beep(880,.08);
        setTimeout(() => { startMatch(); }, 260); }
    }
    refreshSel();
    return;
  }
  if(scene === SC.OVER){
    if(consume('j')){ sel.done1 = sel.done2 = true; startMatch(); }
    if(consume('k')){ sel.done1 = sel.done2 = false; scene = SC.SELECT; showScreen('sel'); refreshSel(); }
    return;
  }

  /* ---- FIGHT ---- */
  ARENA.t += dt;
  if(ARENA.msg > 0){ ARENA.msg -= dt;
    const rm = el('roundmsg');
    rm.textContent = ARENA.msgText; rm.classList.add('show');
    if(ARENA.msg <= 0) rm.classList.remove('show');
  }
  if(ARENA.freeze > 0){ ARENA.freeze -= dt; render(); return; }

  ARENA.time -= dt;
  if(ARENA.time <= 0){ ARENA.time = 0; endRound(null); return; }

  const [f1, f2] = ARENA.fighters;
  f1.update(dt, P1KEYS, f2);
  f2.update(dt, P2KEYS, f1);

  // 朝向对方
  if(f1.canAct() && Math.abs(f1.x - f2.x) > 8) f1.face = f1.x < f2.x ? 1 : -1;
  if(f2.canAct() && Math.abs(f2.x - f1.x) > 8) f2.face = f2.x > f1.x ? -1 : 1;

  // 身体碰撞：不许重叠
  const MIN_D = 54;
  const dx = f2.x - f1.x;
  const adx = Math.abs(dx);
  if(adx < MIN_D && Math.abs(f1.y - f2.y) < 70){
    const push = (MIN_D - adx) / 2 + 0.1;
    const s = dx >= 0 ? 1 : -1;
    f1.x -= push * s; f2.x += push * s;
    f1.x = Math.max(WALL_L, Math.min(WALL_R, f1.x));
    f2.x = Math.max(WALL_L, Math.min(WALL_R, f2.x));
  }

  // 命中判定
  [[f1,f2],[f2,f1]].forEach(([a,b]) => {
    const hb = a.hitbox();
    if(hb && !a.hitDone){
      const hu = b.hurtbox();
      if(hb.x - hb.w/2 < hu.x + hu.w/2 && hb.x + hb.w/2 > hu.x - hu.w/2 &&
         hb.y < hu.y + hu.h && hb.y + hb.h > hu.y){
        a.hitDone = true;
        const dmg = b.takeHit(a.attack, a.face);
        addHitFX((a.x + b.x)/2, GROUND - b.y - 64, dmg);
        updateHUD();
        if(b.hp <= 0) endRound(a);
      }
    }
  });

  FX.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= dt; });
  for(let i=FX.length-1;i>=0;i--) if(FX[i].life <= 0) FX.splice(i,1);

  updateHUD();
}

function endRound(winner){
  if(scene !== SC.FIGHT) return;
  ARENA.freeze = 99;
  let text;
  if(winner === null){
    text = 'TIME UP';
    if(ARENA.fighters[0].hp > ARENA.fighters[1].hp){ ARENA.wins[0]++; winner = ARENA.fighters[0]; }
    else if(ARENA.fighters[1].hp > ARENA.fighters[0].hp){ ARENA.wins[1]++; winner = ARENA.fighters[1]; }
  } else {
    const i = winner === ARENA.fighters[0] ? 0 : 1;
    ARENA.wins[i]++;
    text = 'K.O.';
  }
  const loser = winner ? (winner === ARENA.fighters[0] ? ARENA.fighters[1] : ARENA.fighters[0]) : null;
  if(loser){ loser.state = 'ko'; loser.stun = 999; loser.vx = 0; }
  ARENA.msgText = text; ARENA.msg = 1.4;
  el('roundmsg').textContent = text; el('roundmsg').classList.add('show');
  updateHUD(true);

  setTimeout(() => {
    el('roundmsg').classList.remove('show');
    if(ARENA.wins[0] >= 2 || ARENA.wins[1] >= 2){
      scene = SC.OVER;
      const p1win = ARENA.wins[0] >= 2;
      el('winText').textContent = p1win ? 'P1 获胜' : 'P2 获胜';
      const winnerCfg = p1win ? ROSTER[sel.p1] : ROSTER[sel.p2];
      el('winFace').src = 'sprites/' + winnerCfg.id + '.png';
      el('winName').textContent = winnerCfg.name + ' · ' + winnerCfg.tag;
      showScreen('over');
      el('hud').style.display = 'none';
    } else {
      ARENA.round++;
      newRound();
    }
  }, 1600);
}

/* ================= 渲染 ================= */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.scale(SCALE, SCALE);

  drawBG();

  if(scene === SC.FIGHT){
    const [f1, f2] = ARENA.fighters;
    // 远者先画
    const order = f1.y > f2.y ? [f1,f2] : [f2,f1];
    order.forEach(f => f.drawBody(ctx));
    order.forEach(f => f.drawLimb(ctx));
    FX.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, 2, 2);
      ctx.globalAlpha = 1;
    });
  }
  ctx.restore();
}

function drawBG(){
  // 天
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1020'); g.addColorStop(.55, '#16233a'); g.addColorStop(1, '#0c1220');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // 远处楼
  ctx.fillStyle = '#101a2c';
  for(let i=0;i<14;i++){
    const bw = 26 + (i*37 % 22), bh = 40 + (i*53 % 70);
    ctx.fillRect(i*35 - 10, GROUND - bh - 34, bw, bh);
  }
  // 灯笼
  for(let i=0;i<5;i++){
    const x = 50 + i*96, y = 44 + (i%2)*12;
    ctx.strokeStyle = 'rgba(180,200,240,.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, y-8); ctx.stroke();
    ctx.fillStyle = 'rgba(255,170,70,.10)';
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8873a';
    ctx.beginPath(); ctx.ellipse(x, y, 4.5, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd08a';
    ctx.fillRect(x-2, y-4, 4, 2);
  }
  // 地面
  ctx.fillStyle = '#1d2740';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#26324d';
  ctx.fillRect(0, GROUND, W, 4);
  ctx.strokeStyle = 'rgba(120,150,210,.18)'; ctx.lineWidth = 1;
  for(let i=0;i<24;i++){
    const x = i*20 + 6;
    ctx.beginPath(); ctx.moveTo(x, GROUND + 6); ctx.lineTo(x - 8, H); ctx.stroke();
  }
  // 观众（头肩剪影）
  for(let i=0;i<28;i++){
    const x = 6 + i*17 + (i%3)*2;
    const hh = 10 + (i*7 % 5);
    ctx.fillStyle = i % 2 ? '#0a1120' : '#0d1728';
    ctx.beginPath(); ctx.arc(x, GROUND - 36 - hh, 4, Math.PI, 0); ctx.fill();
    ctx.fillRect(x-4, GROUND - 36 - hh, 8, 12);
  }
  // 栏杆
  ctx.fillStyle = '#0a1220';
  ctx.fillRect(0, GROUND - 22, W, 5);
  ctx.fillStyle = '#131d31';
  for(let i=0;i<W;i+=16) ctx.fillRect(i, GROUND - 22, 3, 22);
}
})();
