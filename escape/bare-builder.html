<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>张昊 · 赤膊形态生成</title>
<style>
  body{margin:0;background:#f3ead8;color:#2a2320;font:15px/1.7 "Songti SC","SimSun",serif}
  .wrap{max-width:760px;margin:0 auto;padding:26px 22px 70px}
  h1{font-size:24px;margin:0 0 4px}
  p{color:#6b5c4a;margin:6px 0}
  .box{display:flex;gap:24px;align-items:flex-start;margin-top:18px;flex-wrap:wrap}
  canvas{image-rendering:pixelated;border:1px solid #c9b89f;
    background:#f7f1e3;box-shadow:4px 4px 0 rgba(42,35,32,.12)}
  .col{display:flex;flex-direction:column;gap:10px}
  .lab{font-size:13px;color:#8a775e;font-family:monospace}
  button{font:16px/1 "Songti SC",serif;padding:12px 22px;border:2px solid #2a2320;
    background:#a01818;color:#fffdf6;border-radius:5px;cursor:pointer;
    box-shadow:3px 3px 0 rgba(42,35,32,.25)}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(42,35,32,.25)}
  #msg{margin-top:10px;color:#a01818;font-size:14px;min-height:22px}
</style></head>
<body><div class="wrap">
  <h1>张昊 · 赤膊形态</h1>
  <p>头、脖子以下到裤腰以上换成赤裸上身（胸肌 / 乳头 / 肚脐），<b>脸、头发、眼镜、裤子、鞋全部原封不动</b>。</p>

  <div class="box">
    <div class="col">
      <div class="lab">原图 96×120</div>
      <canvas id="a" width="96" height="120"></canvas>
    </div>
    <div class="col">
      <div class="lab">赤膊版（放大 4 倍预览）</div>
      <canvas id="b" width="384" height="480"></canvas>
    </div>
    <div class="col">
      <button id="dl">下载 zhanghao-bare.png</button>
      <div id="msg"></div>
    </div>
  </div>
</div>
<script>
var SKIN   = '#e8c4a4';
var SKIN_D = '#d3a883';   /* 暗部：肩下、腹侧、颈下 */
var SKIN_L = '#f2d6bb';   /* 亮部：肩头、胸上 */
var NIP    = '#c08872';
var NIP_D  = '#a86f5c';
var NAVEL  = '#c09a7c';
var LINE   = '#d8b394';   /* 胸肌下缘 */

var img = new Image();
img.onload = function(){ build(); };
img.onerror = function(){ document.getElementById('msg').textContent = '原图载入失败：请确认 sprites/zhanghao.png 存在'; };
img.src = 'sprites/zhanghao.png?v=3';

function build(){
  var a = document.getElementById('a').getContext('2d');
  a.imageSmoothingEnabled = false;
  a.drawImage(img, 0, 0);

  /* 用一块 96×120 的工作画布重绘 */
  var w = document.createElement('canvas');
  w.width = 96; w.height = 120;
  var g = w.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(img, 0, 0);

  /* 1) 把躯干（衬衫 + 袖子）整块刷成肤色 */
  g.fillStyle = SKIN;
  g.fillRect(21, 55, 54, 42);          /* x 21..74, y 55..96 */

  /* 2) 脖子 */
  g.fillStyle = SKIN_D;
  g.fillRect(43, 50, 11, 8);
  g.fillStyle = SKIN;
  g.fillRect(43, 50, 9, 8);
  g.fillRect(53, 52, 1, 5);

  /* 3) 肩线与两侧暗部 */
  g.fillStyle = SKIN_L;
  g.fillRect(22, 57, 52, 2);           /* 肩头亮线 */
  g.fillStyle = SKIN_D;
  g.fillRect(21, 59, 3, 30);           /* 左臂外侧暗 */
  g.fillRect(72, 59, 3, 30);           /* 右臂外侧暗 */
  g.fillRect(21, 86, 54, 2);           /* 胸下/腰腹分界淡影 */

  /* 4) 胸肌：两块，下缘一道弧线 */
  g.fillStyle = SKIN_L;
  g.fillRect(27, 63, 18, 1);
  g.fillRect(51, 63, 18, 1);
  g.fillStyle = LINE;
  g.fillRect(27, 72, 17, 1);
  g.fillRect(33, 73, 8, 1);
  g.fillRect(52, 72, 17, 1);
  g.fillRect(55, 73, 8, 1);
  /* 胸沟 */
  g.fillStyle = SKIN_D;
  g.fillRect(47, 66, 2, 8);

  /* 5) 乳头 */
  g.fillStyle = NIP_D; g.fillRect(34, 68, 3, 3);
  g.fillStyle = NIP;   g.fillRect(35, 68, 1, 1);
  g.fillStyle = NIP_D; g.fillRect(59, 68, 3, 3);
  g.fillStyle = NIP;   g.fillRect(60, 68, 1, 1);

  /* 6) 腹肌中线 + 肚脐 */
  g.fillStyle = SKIN_D; g.fillRect(47, 76, 1, 8);
  g.fillStyle = NAVEL;  g.fillRect(46, 88, 3, 2);
  g.fillStyle = SKIN_D; g.fillRect(46, 90, 3, 1);

  /* 7) 手臂内侧一道暗，别让手和身子糊在一起 */
  g.fillStyle = SKIN_D;
  g.fillRect(27, 74, 1, 16);
  g.fillRect(68, 74, 1, 16);

  /* 8) 把原图里“腰线/裤腰”以上、我方块的接缝抹平：用原图最下面一条躯干色补两行 */
  g.fillStyle = SKIN;
  g.fillRect(21, 94, 54, 2);

  /* 输出大图（4 倍） */
  var b = document.getElementById('b');
  var bg = b.getContext('2d');
  bg.imageSmoothingEnabled = false;
  bg.clearRect(0, 0, b.width, b.height);
  bg.drawImage(w, 0, 0, 96, 120, 0, 0, 384, 480);
  a.clearRect(0,0,96,120);
  a.drawImage(w, 0, 0);

  /* 下载：同源页面下 canvas 不会被污染 */
  document.getElementById('dl').onclick = function(){
    try{
      var url = w.toDataURL('image/png');
      var el = document.createElement('a');
      el.href = url; el.download = 'zhanghao-bare.png';
      document.body.appendChild(el); el.click(); el.remove();
      document.getElementById('msg').textContent = '已下载：zhanghao-bare.png（96×120）';
    }catch(e){
      document.getElementById('msg').textContent = '下载被浏览器拦了：' + e.message;
    }
  };
}
</script>
</body></html>
