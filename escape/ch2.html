<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>第二篇 · 朱星驰 | 盒饭店</title>
<style>
  :root{--bg:#080b11;--line:#243044;--gold:#e8b455;--gold2:#f5d08a;--txt:#e6edf7;--dim:#8a9ab0}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  html,body{-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw, calc(100vh * 16 / 9));height:auto;
    image-rendering:pixelated;display:block;background:#05070b}

  .topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:14px 20px;font-size:13px;letter-spacing:.18em;color:#9fb0c8;pointer-events:none;z-index:5}
  .topbar b{color:var(--gold)}

  .cast{position:fixed;bottom:150px;width:84px;height:104px;overflow:hidden;z-index:5;display:none;pointer-events:none}
  .cast img{display:block;width:84px;height:auto;image-rendering:pixelated;
            filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
  .cast.l{left:48px}
  .cast.r{right:48px}
  #stick{position:fixed;left:14px;top:0;
    width:86px;height:86px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, rgba(255,253,246,.46), rgba(255,253,246,.20));
    border:2px solid rgba(201,178,140,.62);
    box-shadow:0 6px 16px rgba(60,38,14,.22), inset 0 0 0 6px rgba(255,253,246,.16);
    display:none;z-index:9;pointer-events:auto;touch-action:none;
    -webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  #stickKnob{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;
    border-radius:50%;background:rgba(255,253,246,.96);border:2px solid #c2a87f;
    box-shadow:0 3px 8px rgba(60,38,14,.32);transition:transform .07s ease-out}
  @media (orientation:portrait){
    #stick{width:64px;height:64px;left:10px}
    #stickKnob{width:28px;height:28px;margin:-14px 0 0 -14px;background:rgba(255,253,246,.92)}
  }
  @media (pointer:coarse),(max-width:820px){
    #stick{display:block}
    .kbd{display:none}
  }
  .cast.on{display:block}
  .dlg{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(920px,94vw);
    border:1px solid #e3d6bd;border-radius:14px;background:#fffdf6;
    padding:16px 20px 18px 20px;min-height:150px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:8;
    display:grid;grid-template-columns:84px 1fr;column-gap:16px;align-items:start;
    box-shadow:0 18px 48px rgba(70,48,20,.28)}
  .por{position:static;width:84px;height:104px;object-fit:contain;object-position:center bottom;image-rendering:pixelated;
    border-radius:8px;border:1px solid #b7a98f;background:linear-gradient(180deg,#f6efe2,#e6dac6);opacity:.42;transition:opacity .15s,filter .15s}
  .por.hide{opacity:0}
  .por.on{opacity:1;border-color:#6a5a2e;box-shadow:0 0 0 1px rgba(230,190,110,.35),0 6px 18px rgba(0,0,0,.5)}
  .por.left{left:14px}
  .por.right{right:14px}
  .choices{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .choice{padding:9px 18px;border-radius:10px;border:1px solid #d8c3a0;background:#fffaf1;color:#c0392b;
    font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.06)}
  .choice:hover{border-color:#c0392b;background:#fff}
  .choice:active{transform:translateY(1px)}
  .dlg.on{opacity:1;pointer-events:auto}
  .dlg>.por{grid-column:1;grid-row:1 / span 3}
  .dlg>.who,.dlg>.line,.dlg>.tip,.dlg>.choices{grid-column:2}
  @media (orientation:portrait){ .dlg{padding:12px 14px;min-height:0;grid-template-columns:56px 1fr;column-gap:10px} }
  .dlg{color:#3a2a18}
  .who{font-size:12px;letter-spacing:.26em;color:#a8702a;margin-bottom:8px;font-weight:700}
  .line{font-size:15px;line-height:1.9;color:#3a2a18;min-height:56px;white-space:pre-wrap}
  .hl{color:#d23a28;font-weight:800}
  .tip{margin-top:8px;font-size:11.5px;color:#a89a82;letter-spacing:.12em;text-align:right}

  .menu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);
    border:1px solid #e3d6bd;border-radius:16px;background:#fffdf6;padding:18px 20px 14px;
    display:none;z-index:9;box-shadow:0 24px 60px rgba(60,38,14,.35);color:#3a2a18;max-height:92vh;overflow-y:auto}
  .menu.on{display:block}
  .menu h3{margin:0 0 3px;font-size:20px;letter-spacing:.34em;color:#7a3a12;font-weight:800}
  .menu .sub{font-size:12px;color:#8a7358;letter-spacing:.08em;margin-bottom:8px}
  .menu h3+.sub{border-bottom:1px solid #ecdfc6;padding-bottom:10px}
  .grp{font-size:11px;letter-spacing:.3em;color:#a8845a;margin:8px 0 4px}
  #meats,#vegs,#hidden{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .mi{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
    border:1px solid #e8dcc4;border-radius:10px;padding:8px 6px 6px;cursor:pointer;background:#fff;
    box-shadow:0 2px 0 rgba(120,90,50,.06);
    transition:border-color .14s,background .14s,transform .08s}
  .mi:hover{border-color:#c9b28c;background:#fffdf3}
  .mi.on{border-color:#c0392b;background:#fff3ee;box-shadow:0 0 0 2px rgba(192,57,43,.18)}
  .mi:active{transform:translateY(1px)}
  .mi .ic{width:44px;height:44px;border-radius:8px;image-rendering:pixelated;display:block}
  .mi .n{font-size:12.5px;text-align:center;line-height:1.25;color:#4a3520}
  .mi .p{font-size:13px;font-weight:700;color:#c0392b}
  .mi .tag{position:absolute;left:6px;top:6px;font-size:10px;color:#fff;background:rgba(192,57,43,.92);
    border-radius:5px;padding:1px 5px}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
    border-top:1px solid #ecdfc6;padding-top:12px;font-size:13px;color:#7a6a52}
  .foot b{color:#c0392b;font-size:16px}
  .btns{display:flex;gap:8px}
  .btns button{font-family:inherit;font-size:13.5px;padding:9px 18px;border-radius:10px;cursor:pointer;
    border:1px solid #ddceb2;background:#fff;color:#6a5336}
  .btns button:hover{border-color:#c0392b;color:#c0392b}
  .btns button.primary{border-color:#c0392b;background:#c0392b;color:#fff}
  .btns button.primary:hover{background:#a52f22}

  .end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(4,7,11,.86);z-index:12}
  .end.on{display:flex}
  .card{width:min(520px,90vw);border:1px solid #e3d6bd;border-radius:18px;padding:28px 26px;
    background:#fffdf6;text-align:center;color:#3a2a18;box-shadow:0 20px 50px rgba(60,38,14,.30)}
  .card .k{font-size:12px;letter-spacing:.4em;color:#a8702a}
  .card h2{margin:10px 0 4px;font-size:26px;letter-spacing:.1em;color:#2f2317}
  .card .stars{font-size:30px;letter-spacing:.18em;color:#e0a020;line-height:1.2;margin:6px 0 2px}
  .card .time{font-size:13.5px;color:#7a6a52;letter-spacing:.06em}
  .card .row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .card a,.card button{font-family:inherit;font-size:14px;padding:10px 18px;border-radius:10px;
    border:1px solid #d8c3a0;background:#fffaf1;color:#8a5a22;text-decoration:none;cursor:pointer}
  .card button.primary{border-color:#c0392b;color:#fff;background:#c0392b}

  /* 选菜点中弹一下 */
  .mi.pop{transform:scale(1.06);border-color:#c0392b}
  /* 合计超支：闪红 + 抖 */
  .foot.over #total,.foot.over #left{color:#c0392b}
  @keyframes shk{0%,100%{transform:translateX(0)}18%{transform:translateX(-2px)}
    38%{transform:translateX(2px)}58%{transform:translateX(-2px)}78%{transform:translateX(2px)}}
  .foot.shake{animation:shk .28s ease}
  /* HUD 目标徽章 */
  .goal{display:inline-block;margin:0 6px;padding:2px 8px;border-radius:999px;
    border:1px solid rgba(232,180,85,.55);color:var(--gold2);font-size:12px;letter-spacing:.08em}
  .goal.done{border-color:rgba(120,200,140,.55);color:#8fd7a4}
  /* 星级逐颗弹出 */
  @keyframes starPop{0%{opacity:0;transform:scale(.3) translateY(4px)}
    70%{opacity:1;transform:scale(1.18) translateY(0)}100%{opacity:1;transform:scale(1)}}
  .card .stars span{display:inline-block;animation:starPop .26s both}

  /* 进关小框 */
  .brief{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,8,6,.55);z-index:20;backdrop-filter:blur(2px)}
  .brief.on{display:flex}
  .brief .bk{width:min(520px,88vw);background:#fffdf6;border:1px solid #e3d6bd;border-radius:16px;
    padding:30px 30px 24px;text-align:center;box-shadow:0 26px 70px rgba(40,26,10,.45);
    position:relative}
  @keyframes bkIn{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .brief .k{font-size:12px;letter-spacing:.32em;color:#a8702a;font-weight:700}
  .brief h2{margin:12px 0 10px;font-size:26px;line-height:1.5;color:#2a2016;
    font-family:"Kaiti SC","STKaiti",KaiTi,serif;letter-spacing:.06em}
  .brief p{margin:0 0 20px;font-size:14px;line-height:1.9;color:#6b5a44}
  .brief button{font-family:inherit;font-size:15px;padding:11px 34px;border-radius:10px;cursor:pointer;
    border:1px solid #c0392b;background:#c0392b;color:#fff;font-weight:700;letter-spacing:.14em}
  .brief button:hover{background:#a52f22}
  .brief .seal{position:absolute;right:22px;top:20px;width:34px;height:34px;border:2px solid #b23b2e;
    color:#b23b2e;font:700 12px/30px "Kaiti SC",KaiTi,serif;text-align:center;border-radius:5px;transform:rotate(-6deg);opacity:.8}
  /* 手机竖屏：对话框贴在画面正下方，方向键贴画面底边 */
  @media (orientation:portrait){
    .dlg{position:fixed;left:50%;transform:translateX(-50%);
      top:calc(50% + 28.125vw + 10px);bottom:auto;width:min(94vw,560px);
      min-height:0;padding:12px 16px 14px 20px;border-radius:12px}
    .dlg .line{font-size:14px;line-height:1.7;min-height:40px}
    .dlg .tip{font-size:10.5px;margin-top:4px}
    .dlg .who{font-size:11px;margin-bottom:5px}
    .por{width:56px;height:72px;top:10px}
    .choice{padding:7px 14px;font-size:13px}
  }
</style>
</head>
<body>
<div id="app"><canvas id="cv" width="1280" height="720"></canvas></div>

<div class="topbar">
  <div>第二篇 · <b>朱星驰</b>　盒饭店</div>
  <div id="hud">¥ 13　两荤一素　<span class="kbd" style="opacity:.55">A/D·W 走　E 交互</span></div>
</div>

<div class="cast l" id="castL"><img src="sprites/por-zhuxingchi.png?v=6" alt=""></div>
<div class="cast r" id="castR"><img src="sprites/por-wang.png?v=8" alt=""></div>
<div id="stick" aria-label="摇杆"><div id="stickKnob"></div></div>

<div class="dlg" id="dlg">
  <img class="por left"  id="porL" src="sprites/por-zhuxingchi.png?v=4" alt="朱星驰" style="display:none">
  <img class="por right" id="porR" src="sprites/por-wang.png?v=4" alt="王小强" style="display:none">
  <div class="who" id="who">老板</div>
  <div class="line" id="line"></div>
  <div class="choices" id="choices"></div>
  <div class="tip">点击继续</div>
</div>

<div class="brief" id="brief">
  <div class="bk">
    <div class="k">第 一 关</div>
    <h2>帮助朱星驰<br>吃到他想吃的盒饭</h2>
    <p>他身上只有 13 元，还想吃「两荤一素」。</p>
    <button id="briefGo">开 始</button>
  </div>
</div>

<div class="menu" id="menu">
  <h3>餐 单</h3>
  <div class="grp">荤 菜</div>
  <div id="meats"></div>
  <div class="grp">素 菜</div>
  <div id="vegs"></div>
  <div id="hiddenWrap" style="display:none">
    <div class="grp">锅 盖 底 下</div>
    <div id="hidden"></div>
  </div>
  <div class="foot">
    <div>合计 <b id="total">¥ 0</b>　<span id="left"></span></div>
    <div class="btns">
      <button id="cancel">再想想</button>
      <button id="ok" class="primary">就这些</button>
    </div>
  </div>
</div>

<div class="end" id="end">
  <div class="card">
    <div class="k">第 二 篇 · 第 一 关</div>
    <h2>通 关</h2>
    <div class="stars" id="endstars">★ ★ ★</div>
    <div class="time" id="endtime"></div>
    <div class="row">
      <a href="levels.html">← 返回关卡</a>
      <button class="primary" onclick="location.reload()">再玩一次</button>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const g = cv.getContext('2d');
g.imageSmoothingEnabled = false;

const VW = 640, VH = 360, S = 2;

const IMG = {
  zhuxingchi: Object.assign(new Image(), { src: 'sprites/zhuxingchi.png?v=4' }),
  boss:       Object.assign(new Image(), { src: 'sprites/boss.png?v=5' }),
  station:    Object.assign(new Image(), { src: 'sprites/bg-station.png?v=1' }),
};
const FICON = {};
['liuroud','yuxiang','hongshao','jianjiao','xihongshi','disanxian','tudousi'].forEach(function(id){
  FICON[id] = Object.assign(new Image(), { src: 'sprites/food/' + id + '.png?v=5' });
});

const MEATS = [
  { id:'liuroud',  n:'溜肉段',   p:6 },
  { id:'yuxiang',  n:'鱼香肉丝', p:7 },
  { id:'hongshao', n:'红烧肉',   p:5 },
];
const VEGS = [
  { id:'jianjiao', n:'尖椒干豆腐', p:4 },
  { id:'xihongshi',n:'西红柿鸡蛋', p:4 },
  { id:'disanxian',n:'地三鲜',     p:4 },
];
const HIDDEN = { id:'tudousi', n:'炒土豆丝', p:3, hidden:true };
const TARGET = ['liuroud','hongshao','tudousi'];

const G = {
  room:'street', x:168, y:0, face:1, t:0,
  money:13, lidOpen:false, borrowed:false, introSeen:false, duo:false, speech:null,
  picked:new Set(), orderDone:false,
  dlg:null, choosing:false, menuOpen:false, near:null,
  finished:false, walkPhase:0, t0:performance.now()
};

const GROUND_STREET = 312, GROUND_SHOP = 318;

const elDlg=document.getElementById('dlg'), elWho=document.getElementById('who'), elLine=document.getElementById('line'),
      elChoices=document.getElementById('choices'), elPorL=document.getElementById('porL'), elPorR=document.getElementById('porR'),
      elCastL=document.getElementById('castL'), elCastR=document.getElementById('castR');
const elMenu=document.getElementById('menu'), elMeats=document.getElementById('meats'), elVegs=document.getElementById('vegs');
const elHidden=document.getElementById('hidden'), elHiddenWrap=document.getElementById('hiddenWrap');
const elTotal=document.getElementById('total'), elLeft=document.getElementById('left'), elSum=document.getElementById('msum');
const elHud=document.getElementById('hud'), elEnd=document.getElementById('end'), elEndText=document.getElementById('endtext');

function hud(){
  const tip = (typeof TOUCH!=='undefined' && TOUCH) ? '点屏幕 交互' : 'A/D·W 走　E 交互';
  elHud.innerHTML = `¥ ${G.money}` +
    (G.borrowed?'　<span class="goal">已借 1 元</span>':'') +
    `　<span class="kbd" style="opacity:.55">${tip}</span>`;
}

function say(who, lines, onDone){
  const norm = [].concat(lines).map(function(l){ return (typeof l === 'string') ? {t:l} : l; });
  G.dlg = { who, lines:norm, i:0, typed:0, shownH:false, done:onDone||null };
  elWho.textContent = who; elLine.textContent='';
  elChoices.innerHTML=''; G.choosing=false;
  // 只显示“说话人”的头像，固定在对话框左边（对话框内，不是屏幕悬浮层）
  const isZ = who==='朱星驰', isW = who==='王小强';
  if(elCastL) elCastL.classList.remove('on');
  if(elCastR) elCastR.classList.remove('on');
  if(elPorR) elPorR.style.display='none';
  if(elPorL){
    if(isZ || isW){
      elPorL.src = isZ ? 'sprites/por-zhuxingchi.png?v=9' : 'sprites/por-wang.png?v=9';
      elPorL.alt = who;
      elPorL.style.display='block';
      elPorL.classList.add('on');
    }else{
      elPorL.style.display='none';
      elPorL.classList.remove('on');
    }
  }
  elDlg.classList.add('on');
}
function choices(list){
  G.choosing = true;
  elChoices.innerHTML='';
  elDlg.classList.add('on');          // 选项时对话框必须继续显示
  elLine.textContent = '你想说什么？';
  list.forEach(([label, fn])=>{
    const b=document.createElement('button');
    b.className='choice'; b.textContent=label;
    b.onclick=(e)=>{
      e.stopPropagation(); e.preventDefault();
      G.choosing = false; elChoices.innerHTML=''; fn();
    };
    elChoices.appendChild(b);
  });
}
function advance(){
  if(G.choosing) return;          // 有选项时不能用点击/空格跳过
  const d=G.dlg; if(!d) return;
  const cur = d.lines[d.i];
  if(cur && cur.h){ if(!d.shownH){ d.shownH=true; elLine.innerHTML=cur.h; return; } }
  else if(cur && d.typed < cur.t.length){ d.typed=cur.t.length; elLine.textContent=cur.t; return; }
  d.i++; d.shownH=false;
  if(d.i>=d.lines.length){ const cb=d.done; G.dlg=null; elDlg.classList.remove('on'); elChoices.innerHTML='';
    if(elCastL) elCastL.classList.remove('on');
    if(elCastR) elCastR.classList.remove('on');
    if(cb) cb(); }
  else { d.typed=0; elLine.textContent=''; }
}

function totalPrice(){
  let s=0;
  MEATS.concat(VEGS,[HIDDEN]).forEach(d=>{ if(G.picked.has(d.id)) s+=d.p; });
  return s;
}
function rowHtml(d){
  const on=G.picked.has(d.id);
  return `<div class="mi ${on?'on':''}" data-id="${d.id}">
    <img class="ic" src="sprites/food/${d.id}.png?v=5" alt="${d.n}">
    <span class="n">${d.n}</span>
    <span class="p">¥ ${d.p}</span>
    ${d.hidden?'<span class="tag">锅盖里</span>':''}</div>`;
}
function renderMenu(){
  elMeats.innerHTML = MEATS.map(rowHtml).join('');
  elVegs.innerHTML = VEGS.map(rowHtml).join('');
  elHidden.innerHTML = rowHtml(HIDDEN);
  elHiddenWrap.style.display = G.lidOpen ? 'block' : 'none';
  [...document.querySelectorAll('.mi')].forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      if(G.picked.has(id)) G.picked.delete(id); else G.picked.add(id);
      ding(G.picked.has(id));
      const on = G.picked.has(id);
      renderMenu();
      if(on){
        const nEl = document.querySelector(`.mi[data-id="${id}"]`);
        if(nEl){ nEl.classList.add('pop'); setTimeout(()=>nEl.classList.remove('pop'),150); }
      }
    };
  });
  const t = totalPrice();
  elTotal.textContent = '¥ ' + t;
  elLeft.textContent = t > G.money ? `还差 ¥ ${t-G.money}` : (t>0?`剩 ¥ ${G.money-t}`:'');
  const foot = document.querySelector('#menu .foot');
  if(foot) foot.classList.toggle('over', t > G.money);
  if(elSum) elSum.textContent = `身上 ${G.money} 元 · 要两荤一素`;
}
function openMenu(){ G.menuOpen = true; elMenu.classList.add('on'); renderMenu(); }
function closeMenu(){ G.menuOpen=false; elMenu.classList.remove('on'); }

document.getElementById('cancel').onclick = closeMenu;
document.getElementById('ok').onclick = ()=>{
  const t = totalPrice();
  if(G.picked.size === 0) return;
  if(t > G.money){
    const foot = document.querySelector('#menu .foot');
    if(foot){
      foot.classList.add('over','shake');
      setTimeout(()=>foot.classList.remove('shake'), 320);
    }
    buzz(); toast('钱不够，再选选');
    return;
  }
  const set=[...G.picked].sort(), want=[...TARGET].sort();

let AC=null;
function beep(freq, dur, type, vol){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g2=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    const v=vol||0.05, t0=AC.currentTime, D=dur||0.12;
    g2.gain.setValueAtTime(v,t0);
    g2.gain.exponentialRampToValueAtTime(0.0001,t0+D);
    o.connect(g2); g2.connect(AC.destination);
    o.start(t0); o.stop(t0+D+0.02);
  }catch(e){}
}
function coin(){ beep(1180,.07,'triangle',.06); setTimeout(function(){beep(1560,.10,'triangle',.05);},70); }
function swoosh(){ beep(260,.16,'sine',.05); setTimeout(function(){beep(200,.18,'sine',.04);},90); }
function paySound(){ beep(700,.08,'square',.04); setTimeout(function(){beep(920,.08,'square',.04);},90); setTimeout(function(){beep(1180,.14,'square',.04);},180); }

function ensureAC(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function noiseBuf(sec){
  const a=ensureAC(); if(!a) return null;
  const n=Math.floor(a.sampleRate*sec), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function burst(sec, freq, q, vol, type){
  const a=ensureAC(); if(!a) return;
  const b=noiseBuf(sec); if(!b) return;
  const src=a.createBufferSource(); src.buffer=b;
  const f=a.createBiquadFilter(); f.type=type||'lowpass';
  f.frequency.value=freq; f.Q.value=q||1;
  const g2=a.createGain(); const t=a.currentTime;
  g2.gain.setValueAtTime(vol, t); g2.gain.exponentialRampToValueAtTime(.0001, t+sec);
  src.connect(f); f.connect(g2); g2.connect(a.destination); src.start(t);
}
function ding(on){ beep(on?1320:640, .05, 'triangle', .05); setTimeout(()=>beep(on?1760:520,.06,'triangle',.035), 45); }
function clank(){ burst(.16, 1500, 1.2, .10, 'bandpass'); beep(260,.10,'square',.05); setTimeout(()=>beep(180,.14,'square',.04),40); }
function stepSnd(){ burst(.05, 700, .7, .045, 'lowpass'); }
function coinDrop(){ beep(1560,.06,'triangle',.05); setTimeout(()=>beep(2100,.09,'triangle',.035),55); }
function starChime(i){ beep(880 + i*220, .10, 'triangle', .05); }
function buzz(){ beep(120,.12,'sawtooth',.05); setTimeout(()=>beep(96,.14,'sawtooth',.04),110); }

let ENV = null;
function initEnv(){
  const a = ensureAC(); if(!a || ENV) return;
  const master = a.createGain(); master.gain.value = 0.9; master.connect(a.destination);
  // 吊扇
  const fan = a.createOscillator(); fan.type='triangle'; fan.frequency.value=47;
  const fanLp = a.createBiquadFilter(); fanLp.type='lowpass'; fanLp.frequency.value=220;
  const fanG = a.createGain(); fanG.gain.value=.014;
  fan.connect(fanLp); fanLp.connect(fanG); fanG.connect(master); fan.start();
  // 街上车流
  const tnoise = noiseBuf(2); const tSrc = a.createBufferSource(); tSrc.buffer=tnoise; tSrc.loop=true;
  const tLp = a.createBiquadFilter(); tLp.type='lowpass'; tLp.frequency.value=340;
  const tG = a.createGain(); tG.gain.value=.0;
  tSrc.connect(tLp); tLp.connect(tG); tG.connect(master); tSrc.start();
  // 店里电视（带通噪声 + 慢速幅度起伏）
  const vnoise = noiseBuf(2); const vSrc = a.createBufferSource(); vSrc.buffer=vnoise; vSrc.loop=true;
  const vBp = a.createBiquadFilter(); vBp.type='bandpass'; vBp.frequency.value=820; vBp.Q.value=.7;
  const vG = a.createGain(); vG.gain.value=.0;
  vSrc.connect(vBp); vBp.connect(vG); vG.connect(master); vSrc.start();
  const lfo = a.createOscillator(); lfo.frequency.value=.23;
  const lfoG = a.createGain(); lfoG.gain.value=.006;
  lfo.connect(lfoG); lfoG.connect(vG.gain); lfo.start();
  ENV = { traffic:tG, tv:vG, t:0 };
}
function envUpdate(dt){
  if(!ENV) return;
  ENV.t += dt/60;
  const shop = G.room==='shop';
  const a = ensureAC(); if(!a) return;
  ENV.traffic.gain.value += ((shop?0.004:0.020) - ENV.traffic.gain.value) * 0.02;
  ENV.tv.gain.value += ((shop?0.014:0.0) - ENV.tv.gain.value) * 0.02;
}

// 触屏：左侧虚拟摇杆（左右推 → 走）
(function(){
  const base=document.getElementById('stick'), knob=document.getElementById('stickKnob');
  if(!base||!knob) return;
  let pid=null, cx=0, cy=0, R=1;
  function place(dx,dy){ knob.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)'; }
  function apply(dx){
    const dead=6;
    keys['a']= dx < -dead;
    keys['d']= dx >  dead;
  }
  function rect(){
    const r=base.getBoundingClientRect();
    cx=r.left+r.width/2; cy=r.top+r.height/2; R=Math.max(18, r.width/2-11);
  }
  function down(e){
    e.preventDefault(); e.stopPropagation();
    rect(); pid=e.pointerId;
    try{ base.setPointerCapture(pid); }catch(_){}
    move(e);
  }
  function move(e){
    if(pid===null||e.pointerId!==pid) return;
    e.preventDefault();
    let dx=e.clientX-cx, dy=e.clientY-cy;
    const len=Math.hypot(dx,dy)||1;
    if(len>R){ dx=dx/len*R; dy=dy/len*R; }
    place(dx,dy); apply(dx);
  }
  function up(e){
    if(pid===null) return;
    if(e && e.pointerId!==undefined && e.pointerId!==pid) return;
    pid=null; keys['a']=false; keys['d']=false; place(0,0);
  }
  base.addEventListener('pointerdown', down);
  base.addEventListener('pointermove', move);
  base.addEventListener('pointerup', up);
  base.addEventListener('pointercancel', up);
  base.addEventListener('lostpointercapture', up);
  ['touchstart','touchmove','contextmenu','selectstart'].forEach(function(t){
    base.addEventListener(t, function(e){ e.preventDefault(); }, {passive:false});
  });
  // 把摇杆固定在“游戏画面”内的左下角（跟着 canvas 实际矩形走）
  function placeStick(){
    const cv=document.getElementById('cv'); if(!cv) return;
    const r=cv.getBoundingClientRect();
    const w=base.offsetWidth||74, h=base.offsetHeight||74;
    const pad=Math.round(Math.min(14, r.height*0.06));
    let x=Math.round(r.left+pad), y=Math.round(r.bottom-h-pad);
    x=Math.max(4,Math.min(x, innerWidth-w-4));
    y=Math.max(4,Math.min(y, innerHeight-h-4));
    base.style.left=x+'px'; base.style.top=y+'px';
  }
  base.__place=placeStick;
  placeStick();
  addEventListener('load', placeStick);
  addEventListener('resize', function(){ placeStick(); if(pid===null) rect(); });
  addEventListener('orientationchange', function(){ setTimeout(placeStick,60); });
  if(window.visualViewport){ visualViewport.addEventListener('resize', placeStick); }
  [120,400,900,1600].forEach(function(ms){ setTimeout(placeStick, ms); });
})();

  const a = G.t*0.020;
  for(let i=0;i<3;i++){
    const ang = a + i*Math.PI*2/3;
    const dx = Math.cos(ang);
    const w = 20 + 26*Math.abs(dx);
    g.globalAlpha=.085;
    g.fillStyle='#2a1c08';
    g.beginPath();
    g.ellipse(FAN.x + dx*20, GROUND_SHOP+10, w, 6, 0, 0, Math.PI*2);
    g.fill();
    g.globalAlpha=1;
  }
}
function drawFan(){
  const a = G.t*0.020;
  px(FAN.x-2,0,4,16,'#8b8272');
  for(let i=0;i<3;i++){
    const ang = a + i*Math.PI*2/3;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const len = 26 * (0.5 + 0.5*Math.abs(dx));
    const x1 = FAN.x + dx*5, y1 = FAN.y + 6 + dy*2;
    const x2 = FAN.x + dx*len, y2 = FAN.y + 6 + dy*len*0.45;
    g.beginPath();
    g.moveTo(x1,y1); g.lineTo(x2,y2);
    g.lineTo(x2+4, y2+6); g.lineTo(x1+3, y1+7);
    g.closePath();
    g.fillStyle = (Math.sin(ang) > 0) ? '#d8cfbe' : '#c8bfae';
    g.fill();
    g.lineWidth=1; g.strokeStyle='rgba(120,105,80,.45)'; g.stroke();
  }
  px(FAN.x-5,FAN.y,10,7,'#6d6455');
  px(FAN.x-2,FAN.y-3,4,4,'#8c8474');
}

function drawChef(x,y){
  const im=IMG.boss, w=96, h=120;
  // 呼吸起伏 + 极轻的左右晃
  const bob = Math.sin(G.t*0.085)*1.7;
  const sway = Math.sin(G.t*0.031)*1.1;
  const px0 = x + sway;
  g.globalAlpha=.28; g.fillStyle='#000';
  g.beginPath(); g.ellipse(x,y+96,24,6,0,0,Math.PI*2); g.fill(); g.globalAlpha=1;
  if(im.complete && im.naturalWidth){
    g.globalAlpha=.06; g.fillStyle='#000';
    g.beginPath(); g.ellipse(px0+2,y+34,26,54,0,0,Math.PI*2); g.fill(); g.globalAlpha=1;
    g.drawImage(im, px0-w/2, y-24+bob, w, h);

  }
  px(px0-18,y+30+bob,38,58,'#e8e2d2');
  px(px0-22,y+58+bob,46,34,'#f2ede2');
}

function drawLid(x,y){
  // 锅身
  px(x-21,y+16,42,18,'#2b2b31');
  px(x-21,y+16,42,3,'#3d3d46');
  px(x-24,y+14,48,5,'#1e1e24');
  px(x-3,y+30,8,4,'#1a1a1f');
  shadow(x, y+34, 26, 6, .18);

  if(!G.lidOpen){
    // 坐在锅沿上：横向小抖 + 极小的上下压弹，不离开锅口
    const jx = Math.sin(G.t*0.85)*1.1 + (Math.sin(G.t*2.3)>0.86?0.7:0);
    const jy = Math.abs(Math.sin(G.t*1.6))*0.6;
    const ly = y + 9;
    // 锅盖沿压在锅口上（先画锅沿再画盖，盖沿盖住缝）
    px(x-24,y+12,48,4,'#1e1e24');
    g.save(); g.translate(jx, jy);
    px(x-21,ly-1,42,4,'#6f747c');     // 盖沿底
    px(x-20,ly-7,40,7,'#8a8f96');     // 盖面
    px(x-20,ly-7,40,2,'#b9bec6');
    px(x-18,ly-5,36,1,'rgba(255,255,255,.18)');
    px(x-8,ly-13,16,7,'#7d828a');     // 提手
    px(x-4,ly-16,8,4,'#9aa0a8');
    g.restore();
    px(x-24,y+15,48,3,'#151519');
    for(let i=0;i<4;i++){
      const p=(G.t*0.6+i*30)%90;
      g.globalAlpha=0.16*(1-p/90);
      px(x-4+Math.sin((G.t+i*20)*0.08)*5, y-12-p*0.5, 9, 8,'#fff');
      g.globalAlpha=1;
    }
    const lg=g.createRadialGradient(x,y-6,2,x,y-6,46);
    lg.addColorStop(0,'rgba(255,214,140,.22)'); lg.addColorStop(1,'rgba(255,214,140,0)');
    g.fillStyle=lg; g.fillRect(x-46,y-52,92,92);
    return;
  }

  // 掀开：露出锅里的炒土豆丝
  px(x-18,y-1,36,16,'#55585f');        // 锅口
  px(x-16,y,32,13,'#1d2128');          // 内壁阴影
  px(x-14,y+1,28,10,'#3a2f20');        // 锅底
  const Y1='#e8ca70', Y2='#cfae52', Y3='#f4dc94';
  px(x-12,y+3,24,1,Y1); px(x-11,y+5,20,1,Y2);
  px(x-13,y+7,24,1,Y3); px(x-10,y+9,18,1,Y1);
  px(x-6,y+2,7,1,Y2);   px(x+1,y+6,8,1,Y3);
  px(x-8,y+4,2,2,'#c2553c'); px(x+4,y+8,2,2,'#4f7a3a'); px(x+7,y+4,2,2,'#c2553c');
  // 靠在锅边的锅盖
  px(x+19,y+1,4,15,'#8a8f96');
  px(x+15,y+1,10,3,'#9aa0a8');
  px(x+19,y+1,1,15,'#b9bec6');
  // 热气
  for(let i=0;i<3;i++){
    const p=(G.t*0.9+i*40)%130;
    g.globalAlpha=0.20*(1-p/130);
    px(x-8+i*7+Math.sin((G.t+i*30)*0.06)*3, y-2-p*0.30, 7, 6,'#fff');
    g.globalAlpha=1;
  }
}

let TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window);
if(new URLSearchParams(location.search).get('touch')==='1') TOUCH=true;

function drawTouchUI(){
  if(!TOUCH || G.finished) return;
  const cy = VH - 42, r = 24;
  [['\u25C0', 58], ['\u25B6', VW-58]].forEach(function(it){
    g.globalAlpha=.84; g.fillStyle='#fffdf6';
    g.beginPath(); g.arc(it[1], cy, r, 0, Math.PI*2); g.fill();
    g.globalAlpha=1; g.lineWidth=2; g.strokeStyle='#c9b28c'; g.stroke();
    g.fillStyle='#8a5a22'; g.font='bold 18px system-ui'; g.textAlign='center';
    g.fillText(it[0], it[1], cy+7); g.textAlign='left';
  });
}

function drawSpeech(){
  const sp=G.speech; if(!sp) return;
  const el = performance.now() - sp.t0;
  let a = 1;
  if(el < 260) a = el/260;
  else if(el > sp.dur-700) a = Math.max(0, (sp.dur-el)/700);
  if(a<=0 || el>sp.dur+200){ G.speech=null; return; }

  const L1='好饿啊，想吃个盒饭。今天带了 13 元。', L2a='奢侈一把，吃个', L2b='两荤一素', L2c='吧。';
  g.font='12px "PingFang SC",sans-serif';
  const w2 = g.measureText(L2a).width + g.measureText(L2b).width + g.measureText(L2c).width;
  g.font='bold 12px "PingFang SC",sans-serif';
  const w2b = g.measureText(L2b).width;
  g.font='12px "PingFang SC",sans-serif';
  const w1 = g.measureText(L1).width;
  const padX=12, padY=10, lh=20;
  const bw = Math.max(w1, w2) + padX*2;
  const bh = lh*2 + padY*2;

  // 位置：整体在人的右侧（右侧放不下就翻到左侧），高度贴着发际线
  let by = G.y - 114 - bh;
  let onRight = true;
  let bx = G.x + 34;
  if(bx + bw > VW-8){ bx = G.x - 34 - bw; onRight = false; }
  if(bx < 8){ bx = 8; onRight = false; }
  if(by < 26) by = 26;

  g.globalAlpha = a;
  // 圆角白底
  const r=8;
  g.beginPath();
  g.moveTo(bx+r,by); g.lineTo(bx+bw-r,by); g.quadraticCurveTo(bx+bw,by,bx+bw,by+r);
  g.lineTo(bx+bw,by+bh-r); g.quadraticCurveTo(bx+bw,by+bh,bx+bw-r,by+bh);
  g.lineTo(bx+r,by+bh); g.quadraticCurveTo(bx,by+bh,bx,by+bh-r);
  g.lineTo(bx,by+r); g.quadraticCurveTo(bx,by,bx+r,by); g.closePath();
  g.fillStyle='#fffdf6'; g.fill();
  g.lineWidth=1.5; g.strokeStyle='#c9b28c'; g.stroke();
  // 小尾巴：从气泡侧边指向朱星驰的头
  const ty = by + bh - 16;
  g.beginPath();
  if(onRight){ g.moveTo(bx+1, ty-7); g.lineTo(bx-9, ty); g.lineTo(bx+1, ty+7); }
  else      { g.moveTo(bx+bw-1, ty-7); g.lineTo(bx+bw+9, ty); g.lineTo(bx+bw-1, ty+7); }
  g.closePath(); g.fillStyle='#fffdf6'; g.fill();
  g.strokeStyle='#c9b28c'; g.beginPath();
  if(onRight){ g.moveTo(bx+1, ty-7); g.lineTo(bx-9, ty); g.lineTo(bx+1, ty+7); }
  else      { g.moveTo(bx+bw-1, ty-7); g.lineTo(bx+bw+9, ty); g.lineTo(bx+bw-1, ty+7); }
  g.stroke();

  // 文字
  g.textAlign='left';
  g.fillStyle='#3a2a18'; g.font='12px "PingFang SC",sans-serif';
  g.fillText(L1, bx+padX, by+padY+12);
  const y2 = by+padY+lh+12;
  g.fillText(L2a, bx+padX, y2);
  g.fillStyle='#e0453a'; g.font='bold 12px "PingFang SC",sans-serif';
  g.fillText(L2b, bx+padX+g.measureText(L2a).width, y2);
  g.fillStyle='#3a2a18'; g.font='12px "PingFang SC",sans-serif';
  g.fillText(L2c, bx+padX+g.measureText(L2a).width+w2b, y2);
  g.globalAlpha=1;
}

let last=performance.now();
let BRIEFING=false;
function loop(now){
  const dt=Math.min(40,now-last)/16.6667; last=now; G.t+=dt;
  if(BRIEFING){ g.setTransform(S,0,0,S,0,0);
    if(G.room==='street') drawStreet(); else drawShop();
    drawPlayer(); hud(); requestAnimationFrame(loop); return; }

  if(G.speech){ G.speech.t += dt/60; }
  envUpdate(dt);
  if(!G.dlg && !G.menuOpen && !G.finished){
    const spd=1.5*dt; let vx=0;
    if(keys['a']||keys['arrowleft']) vx-=spd;
    if(keys['d']||keys['arrowright']||keys['w']) vx+=spd;   // W 也是往前走
    if(vx){
      G.x+=vx; G.face = vx>0?1:-1; G.walkPhase+=0.25*dt;
      G.stepT = (G.stepT||0) + dt/60;
      if(G.stepT > 0.27){ G.stepT = 0; stepSnd(); }
    } else { G.stepT = 0.27; }
    G.x = Math.max(G.room==='street'?30:36, Math.min(G.room==='street'?606:566, G.x));
  }
  G.y = G.room==='street'?GROUND_STREET:GROUND_SHOP;

  G.near=null;
  if(G.room==='street'){ if(G.x>540) G.near='door'; }
  else{
    if(G.x>290 && G.x<500) G.near='counter';
    else if(G.x>=500 && G.x<560) G.near='lid';
    else if(G.x>=548) G.near='wang';
    else if((G.x>60&&G.x<160)||(G.x>210&&G.x<300)||(G.x>400&&G.x<500)) G.near='table';
  }

  g.setTransform(S,0,0,S,0,0);
  if(G.room==='street') drawStreet(); else drawShop();
  drawPlayer();
  // DOM 触屏按钮（#tL/#tR）已接管，画布内不再重复绘制
  drawSpeech();

  // 金色粒子（付款）
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life-=dt/58;
    if(p.life<=0){ PARTS.splice(i,1); continue; }
    g.globalAlpha=Math.max(0,p.life);
    px(p.x, p.y, 3, 3, p.c);
    g.globalAlpha=1;
  }

  const vg=g.createRadialGradient(VW/2,VH/2,VH*0.35,VW/2,VH/2,VH*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.22)');
  g.fillStyle=vg; g.fillRect(0,0,VW,VH);

  if(TOAST.t>0){
    TOAST.t-=dt/60;
    g.font='12px "PingFang SC",sans-serif';
    const tw=g.measureText(TOAST.txt).width+22;
    g.globalAlpha=Math.max(0,Math.min(1,TOAST.t));
    px(VW/2-tw/2,VH-58,tw,24,'rgba(8,12,18,.86)');
    g.strokeStyle='rgba(232,180,85,.55)'; g.lineWidth=1;
    g.strokeRect(VW/2-tw/2+.5,VH-57.5,tw-1,23);
    g.fillStyle='#f5d08a'; g.textAlign='center'; g.fillText(TOAST.txt,VW/2,VH-41); g.textAlign='left';
    g.globalAlpha=1;
  }
  if(G.dlg){
    const d=G.dlg, cur=d.lines[d.i];
    if(cur && !cur.h && d.typed<cur.t.length){
      d.typed=Math.min(cur.t.length,d.typed+1.8*dt);
      elLine.textContent=cur.t.slice(0,Math.floor(d.typed));
    }
  }
  requestAnimationFrame(loop);
}

        else if(++tries>40) clearInterval(iv);
        if(G.dlg && G.dlg.i!==undefined) advance();
      },120);
    },80);
  }
  if(q.get('menu')==='1' && q.get('pick')) setTimeout(openMenu,120);
  if(q.get('instant')==='1'){
    const st=document.createElement('style');
    st.textContent='.dlg,.menu,.end{transition:none!important}';

  }
