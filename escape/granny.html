<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老太太 · 面膜 / 皱纹</title>
<style>
  :root{ --paper:#e9dcbe; --ink:#2b241d; --red:#a8331f; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","Noto Serif SC",serif;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 40px; gap:18px;
  }
  h1{ font-size:26px; letter-spacing:.18em; margin:0; font-weight:600; }
  .sub{ font-size:13px; opacity:.62; margin-top:-12px; }
  .row{ display:flex; gap:34px; flex-wrap:wrap; justify-content:center; }
  figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .frame{
    padding:14px; border:2px solid #2b241d;
    background:#f6efdc; box-shadow:0 2px 0 #2b241d;
  }
  img{
    display:block; width:288px; height:360px;
    image-rendering:pixelated; image-rendering:crisp-edges;
  }
  figcaption{ font-size:14px; letter-spacing:.1em; }
  figcaption b{ color:var(--red); font-weight:600; }
  .toggle{
    margin-top:6px; display:flex; align-items:center; gap:10px;
    border:2px solid #2b241d; background:#f6efdc; padding:8px 14px;
    font-size:14px; cursor:pointer; box-shadow:0 2px 0 #2b241d;
  }
  .toggle:active{ transform:translateY(1px); box-shadow:0 1px 0 #2b241d; }
  .hint{ font-size:12px; opacity:.55; }
  footer{ font-size:12px; opacity:.5; margin-top:6px; }
  @media (max-width:560px){
    img{ width:160px; height:200px; }
    .row{ gap:18px; }
    h1{ font-size:21px; }
  }
</style>
</head>
<body>
  <h1>老太太</h1>
  <p class="sub">96×120 · 与游戏立绘同比例</p>

  <div class="row">
    <figure>
      <div class="frame"><img id="a" src="sprites/granny-mask.png?v=1" alt="面膜"></div>
      <figcaption>敷着<b>面膜</b></figcaption>
    </figure>
    <figure>
      <div class="frame"><img id="b" src="sprites/granny.png?v=1" alt="皱纹"></div>
      <figcaption>拿掉面膜 · <b>满脸皱纹</b></figcaption>
    </figure>
  </div>

  <button class="toggle" id="swap">只看一张（切换）</button>
  <p class="hint">点按钮在「面膜 / 皱纹」之间来回切</p>

  <footer>肘家班 · 逃生</footer>

<script>
  var one = false;
  var a = document.getElementById('a'), b = document.getElementById('b');
  document.getElementById('swap').addEventListener('click', function(){
    one = !one;
    a.parentNode.parentElement.style.display = one ? 'none' : 'flex';
    b.parentNode.parentElement.style.display = 'flex';
    a.src = 'sprites/granny.png?v=1';
    if(!one){ a.src = 'sprites/granny-mask.png?v=1'; }
  });
</script>
</body>
</html>
