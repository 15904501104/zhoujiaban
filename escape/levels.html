<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>关卡选择 | 肘家班 · 逃出十二篇</title>
<style>
  html,body{margin:0;height:100%;background:#e9dcbe;overflow:hidden}
  #cv{width:100%;height:100%;display:block}
  #toast{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);
    background:#2a241c;color:#f5ebd6;padding:10px 18px;border-radius:8px;font:14px "Kaiti SC",KaiTi,serif;
    opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:.94}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="toast"></div>
<script>
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const toastEl=document.getElementById('toast');
let W=1280,H=720,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

/* ---------- 纸与墨 ---------- */
const PAPER='#e9dcbe', PAPER2='#f2e8d2', INK='#2a241c';
function rng(seed){ let s=seed||1; return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
function line(x1,y1,x2,y2,w,a,jit){
  jit=jit||0; g.save(); g.globalAlpha=(a==null?1:a); g.strokeStyle=INK; g.lineWidth=w||2; g.lineCap='round';
  g.beginPath(); g.moveTo(x1+ (Math.random()-.5)*jit, y1+(Math.random()-.5)*jit);
  const n=Math.max(2,Math.round(Math.hypot(x2-x1,y2-y1)/26));
  for(let i=1;i<=n;i++){ const t=i/n;
    g.lineTo(x1+(x2-x1)*t+(Math.random()-.5)*jit, y1+(y2-y1)*t+(Math.random()-.5)*jit); }
  g.stroke(); g.restore();
}
function box(x,y,w,h,jit,a){
  jit=jit||0;
  line(x,y,x+w,y,1.8,a,jit); line(x+w,y,x+w,y+h,1.8,a,jit);
  line(x+w,y+h,x,y+h,1.8,a,jit); line(x,y+h,x,y,1.8,a,jit);
}
function fill(x,y,w,h,c){ g.save(); g.fillStyle=c; g.fillRect(x,y,w,h); g.restore(); }

let paper=null;
function buildPaper(){
  paper=document.createElement('canvas'); paper.width=Math.round(W); paper.height=Math.round(H);
  const p=paper.getContext('2d');
  p.fillStyle=PAPER; p.fillRect(0,0,W,H);
  const r=rng(7331);
  for(let i=0;i<2600;i++){
    const x=r()*W, y=r()*H, a=.02+r()*.05;
    p.fillStyle='rgba(120,96,58,'+a.toFixed(3)+')';
    p.fillRect(x,y,1+r()*2,1+r()*1.4);
  }
  // 水渍
  for(let i=0;i<7;i++){
    const x=r()*W, y=r()*H, rad=60+r()*160;
    const grd=p.createRadialGradient(x,y,rad*.2,x,y,rad);
    grd.addColorStop(0,'rgba(150,120,70,.10)');
    grd.addColorStop(1,'rgba(150,120,70,0)');
    p.fillStyle=grd; p.beginPath(); p.arc(x,y,rad,0,Math.PI*2); p.fill();
  }
  // 装订孔
  for(let i=0;i<5;i++){
    const y=90+i*130;
    p.fillStyle='rgba(70,58,40,.35)'; p.beginPath(); p.arc(34,y,7,0,Math.PI*2); p.fill();
    p.fillStyle='rgba(255,250,235,.35)'; p.beginPath(); p.arc(34,y-1.5,5,0,Math.PI*2); p.fill();
  }
  // 四边压暗
  const edge=p.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);
  edge.addColorStop(0,'rgba(80,60,30,0)'); edge.addColorStop(1,'rgba(80,60,30,.28)');
  p.fillStyle=edge; p.fillRect(0,0,W,H);
}

/* ---------- 关卡数据 ---------- */
const KEY='zjban.escape.progress';
let progress={}; try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
const Q=new URLSearchParams(location.search); if(Q.get('done')==='1') progress['zhuxingchi']=true;
const done1=!!progress['zhuxingchi'];

const LEVELS=[
  {n:1, name:'盒饭',      who:'朱星驰', ok:true,  href:'ch2.html?v=230', tag:'可以游玩'},
  {n:2, name:'待续',      who:'朱星驰', ok:done1, tag:done1?'已解锁 · 制作中':'通关第 1 关解锁'},
  {n:3, name:'待续',      who:'',      ok:false, tag:'通关第 2 关解锁'},
  {n:4, name:'未完成',    who:'',      ok:false, tag:'锁定'},
];

let hover=-1, press=-1, cards=[];
function cardRect(i){
  const cw=Math.min(238,(W-160)/2-18), ch=186;
  const gapx=26, gapy=26;
  const totalW=cw*2+gapx, totalH=ch*2+gapy;
  const x0=(W-totalW)/2, y0=Math.max(150,(H-totalH)/2+34);
  return {x:x0+(i%2)*(cw+gapx), y:y0+Math.floor(i/2)*(ch+gapy), w:cw, h:ch};
}
function toast(m){ toastEl.textContent=m; toastEl.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('on');},1700); }
let toastT=0;

function drawCard(lv,i,t){
  const r=cardRect(i); cards[i]=r;
  const on=(hover===i||press===i);
  const locked=!lv.ok;
  // 卡面
  g.save(); g.globalAlpha=on&&!locked?.94:.5;
  fill(r.x,r.y,r.w,r.h, on&&!locked?INK:PAPER2); g.restore();
  if(!(on&&!locked)) fill(r.x+4,r.y+4,r.w-8,r.h-8,'rgba(242,232,210,.6)');
  box(r.x,r.y,r.w,r.h,2.4,locked?.28:.9);
  // 左上角编号（红章感）
  g.save();
  g.globalAlpha=locked?.30:.95;
  g.fillStyle= locked?'rgba(36,31,24,.28)':'#b23b2e';
  g.font='700 54px "Kaiti SC","STKaiti",KaiTi,serif';
  g.textBaseline='alphabetic';
  g.fillText(String(lv.n), r.x+18, r.y+62);
  g.restore();
  // 名称
  g.save();
  g.fillStyle= on&&!locked?'#f5ebd6':(locked?'rgba(36,31,24,.34)':INK);
  g.font='700 24px "Kaiti SC","STKaiti",KaiTi,serif';
  g.fillText(lv.name, r.x+18, r.y+100);
  if(lv.who){
    g.globalAlpha= on&&!locked?.62:.5;
    g.font='13px "Kaiti SC","STKaiti",KaiTi,serif';
    g.fillText(lv.who, r.x+18, r.y+122);
  }
  // 状态
  g.globalAlpha= locked?.42:.68;
  g.font='12.5px "Kaiti SC","STKaiti",KaiTi,serif';
  g.fillText(lv.tag, r.x+18, r.y+r.h-18);
  g.restore();
  // 锁 / 箭头
  if(locked){
    const cx=r.x+r.w-52, cy=r.y+r.h-62;
    g.save(); g.globalAlpha=.34; g.strokeStyle=INK; g.lineWidth=2.4;
    g.beginPath(); g.arc(cx,cy-9,11,Math.PI,0); g.stroke();
    g.strokeRect(cx-14,cy-9,28,22); g.restore();
  }else{
    g.save(); g.globalAlpha= on?.9:.42; g.strokeStyle= on?'#f5ebd6':INK; g.lineWidth=2.6;
    const cx=r.x+r.w-44, cy=r.y+r.h-56;
    g.beginPath(); g.moveTo(cx-9,cy); g.lineTo(cx+7,cy); g.moveTo(cx+1,cy-7); g.lineTo(cx+8,cy); g.lineTo(cx+1,cy+7);
    g.stroke(); g.restore();
  }
}

function draw(t){
  g.clearRect(0,0,W,H);
  if(!paper) buildPaper();
  g.drawImage(paper,0,0,W,H);

  // 顶部
  g.save();
  g.fillStyle=INK; g.font='700 44px "Kaiti SC","STKaiti",KaiTi,serif';
  g.fillText('关卡选择', 88, 86);
  g.globalAlpha=.55; g.font='14px "Kaiti SC","STKaiti",KaiTi,serif';
  g.fillText('肘家班小游戏', 90, 112);
  line(88,126, 88+300, 126, 1.6, .45, 2);
  g.restore();

  // 返回
  g.save();
  g.globalAlpha= hover===-2?.95:.6;
  g.fillStyle=INK; g.font='15px "Kaiti SC","STKaiti",KaiTi,serif';
  g.textAlign='right';
  g.fillText('← 返回主页', W-64, 74);
  g.restore();

  // 卡片
  for(let i=0;i<LEVELS.length;i++) drawCard(LEVELS[i], i, t);

  // 页脚
  g.save(); g.globalAlpha=.5; g.fillStyle=INK;
  g.font='12.5px "Kaiti SC","STKaiti",KaiTi,serif';
  const done=done1?1:0;
  g.fillText('本机进度：第 1 关'+(done?'已通关':'未通关')+'　·　进度只存在这台设备的浏览器里', 88, H-34);
  g.restore();
}

function frame(t){ draw(t); requestAnimationFrame(frame); }

/* ---------- 交互 ---------- */
function pos(ev){ const r=cv.getBoundingClientRect(); return {x:(ev.clientX-r.left), y:(ev.clientY-r.top)}; }
function hitTest(p){
  if(p.x>W-260 && p.y<96 && p.y>48) return -2;
  for(let i=0;i<cards.length;i++){ const r=cards[i];
    if(r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h) return i; }
  return -1;
}
cv.addEventListener('pointermove',function(ev){ hover=hitTest(pos(ev)); cv.style.cursor = hover>=0||hover===-2?'pointer':'default'; });
cv.addEventListener('pointerdown',function(ev){ press=hitTest(pos(ev)); });
cv.addEventListener('pointerup',function(ev){
  const i=hitTest(pos(ev)); if(i===press) pick(i); press=-1;
});
function pick(i){
  if(i===-2){ location.href='title.html'; return; }
  const lv=LEVELS[i]; if(!lv) return;
  if(!lv.ok){
    if(lv.n===2) toast('先通关第 1 关，才能玩第 2 关');
    else if(lv.n===3) toast('第 2 关还没做完');
    else toast('这一关还没做完');
    return;
  }
  if(lv.href){ location.href=lv.href; return; }
  toast('第 '+lv.n+' 关还在制作中');
}
window.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ location.href='title.html'; }
  if(e.key==='1'||e.key==='2'||e.key==='3'||e.key==='4'){ pick(+e.key-1); }
});
requestAnimationFrame(frame);
</script>
</body>
</html>
