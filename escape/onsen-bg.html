<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>温泉 · 背景预览</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a12;overflow:hidden;
    font-family:"Songti SC","STSong",serif;color:#cdbfa6}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 0 1px #2a2233,0 20px 60px rgba(0,0,0,.6)}
  #tag{position:fixed;left:16px;bottom:14px;font-size:12px;letter-spacing:.18em;opacity:.5}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="360"></canvas></div>
<div id="tag">温泉 · 320×180 → 放大预览（空格切换 黄昏 / 夜）</div>
<script>
window.onerror = function (m, s, l, c, e) {
  var d = document.getElementById('tag');
  if (d) {
    d.textContent = 'JS ERROR: ' + m + '  @line ' + l;
    d.style.color = '#ff6b6b'; d.style.opacity = 1; d.style.fontSize = '14px';
  }
  document.title = 'ERR ' + m;
};
(function(){
  var W = 320, H = 180;            /* 逻辑像素：和人物立绘同一颗粒度，放大 2×~4× 观看 */
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  function fit(){
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    s = Math.max(2, Math.floor(s));          /* 整数倍缩放，保持像素硬边 */
    cv.style.width = (W * s) + 'px';
    cv.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  /* ---------- 调色 ---------- */
  var P = {
    skyT:'#1b1426', skyM:'#3a2440', skyL:'#7b4038', glow:'#e59b58',
    mtnFar:'#3a2c46', mtnFar2:'#2c2338', snow:'#cfc7d6',
    mtnMid:'#241d31', mtnMid2:'#1b1626',
    bamboo:'#28331f', bamboo2:'#33421f', leaf:'#3d5127',
    roof:'#241a17', roofEdge:'#3a2a22', wall:'#5c4030', wall2:'#4a3327',
    win:'#e9b268', winDim:'#a97a44',
    lantern:'#b8362c', lantern2:'#e0503c', lanternGlow:'rgba(240,170,90,.25)',
    fence:'#3b3130', fenceLight:'#4e4038',
    stone:'#464150', stone2:'#575162', stone3:'#332f3c', stoneLit:'#6b6376',
    water:'#22333c', water2:'#2b4350', ripple:'#6f9aa4', reflect:'#c98d55',
    wood:'#3d2a1e', wood2:'#563b28', wood3:'#6d4a30',
    steam:'220,226,236'
  };
  var night = false;

  function r(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(x|0,y|0,w|0,h|0); }

  /* ---------- 背景：天空 ---------- */
  function sky(){
    var i, t;
    for(i=0;i<H;i++){
      t = i / H;
      var c;
      if(night){
        c = t < .55 ? mix('#0b0a16','#1a1730',t/.55) : mix('#1a1730','#2a2038',(t-.55)/.45);
      }else{
        c = t < .45 ? mix(P.skyT,P.skyM,t/.45) : mix(P.skyM,P.skyL,(t-.45)/.55);
      }
      r(0,i,W,1,c);
    }
    /* 星星 */
    var sp = [[23,12],[61,7],[88,19],[140,9],[173,15],[210,6],[248,17],[286,11],[304,22],[126,26],[39,24]];
    for(i=0;i<sp.length;i++){
      var a = night ? .85 : .35;
      ctx.globalAlpha = a * (0.55 + 0.45*Math.sin(clock*0.002 + i));
      r(sp[i][0], sp[i][1], 1, 1, '#fff4d8');
    }
    ctx.globalAlpha = 1;
    /* 落日 / 月亮 */
    if(night){
      ctx.globalAlpha=.9;
      for(i=0;i<9;i++){ r(262+i, 26-Math.round(Math.sin(i/8*Math.PI)*4), 1, 1, '#e8e2cf'); }
      ctx.globalAlpha=1;
    }else{
      ctx.globalAlpha=.5; r(246,30,26,10,P.glow); ctx.globalAlpha=.35; r(238,26,42,18,P.glow);
      ctx.globalAlpha=.9; r(252,32,14,7,'#ffd9a0'); ctx.globalAlpha=1;
    }
  }
  function mix(a,b,t){
    function hx(s){ return [parseInt(s.substr(1,2),16),parseInt(s.substr(3,2),16),parseInt(s.substr(5,2),16)]; }
    var A=hx(a), B=hx(b);
    return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';
  }

  /* ---------- 远山 ---------- */
  function mountains(){
    var i, y;
    /* 最远一层 */
    var far = [[0,96],[14,86],[26,90],[38,78],[52,84],[66,72],[80,80],[94,70],[108,78],
               [122,68],[136,76],[150,66],[164,74],[180,64],[196,74],[210,66],[226,76],
               [242,68],[258,78],[272,70],[288,80],[302,72],[316,82]];
    for(i=0;i<far.length-1;i++){
      var x0=far[i][0], y0=far[i][1], x1=far[i+1][0], y1=far[i+1][1];
      for(var x=x0;x<x1;x++){
        y = y0 + (y1-y0)*(x-x0)/(x1-x0);
        r(x, y, 1, 120-y, P.mtnFar);
        if(y<80){ r(x, y, 1, 2, P.snow); }
      }
    }
    /* 中景一层（更暗更近） */
    var mid = [[0,110],[20,100],[40,106],[58,96],[76,104],[96,92],[116,102],[134,94],
               [154,104],[172,96],[190,106],[208,98],[228,108],[246,100],[266,110],
               [284,102],[302,112],[320,104]];
    for(i=0;i<mid.length-1;i++){
      var a0=mid[i][0], b0=mid[i][1], a1=mid[i+1][0], b1=mid[i+1][1];
      for(var xx=a0;xx<a1;xx++){
        var yy = b0 + (b1-b0)*(xx-a0)/(a1-a0);
        r(xx, yy, 1, 130-yy, P.mtnMid);
      }
    }
  }

  /* ---------- 竹林 / 树影 ---------- */
  function bamboo(){
    var xs = [6,15,27,40,300,311,204,214,192];
    for(var i=0;i<xs.length;i++){
      var x = xs[i], h = 60 + (i%4)*10;
      var c = (i%2) ? P.bamboo : P.bamboo2;
      r(x, 118-h+40, 2, h, c);
      /* 竹节 */
      for(var k=8;k<h;k+=9){ r(x, 118-h+40+k, 2, 1, mix(c,'#000000',.35)); }
      /* 叶 */
      for(var j=0;j<4;j++){
        var ly = 60 + ((i*13+j*17)%34);
        r(x-3+(j%2)*4, ly, 3, 1, P.leaf);
        r(x+2-((j%2)*4), ly+3, 3, 1, P.leaf);
      }
    }
  }

  /* ---------- 温泉旅馆（中景右边） ---------- */
  function inn(){
    var bx = 228, by = 78, bw = 84, bh = 44;
    r(bx, by+10, bw, bh, P.wall);
    r(bx, by+10, bw, 3, P.wall2);
    /* 屋顶（两层出檐） */
    r(bx-6, by+4, bw+12, 7, P.roof);
    r(bx-3, by+2, bw+6, 3, P.roofEdge);
    r(bx-2, by+9, bw+4, 2, '#150f0d');
    /* 窗（暖光） */
    for(var i=0;i<3;i++){
      var wx = bx + 10 + i*24;
      r(wx, by+20, 14, 12, night ? P.winDim : P.win);
      r(wx, by+20, 14, 1, '#7a5228');
      r(wx+6, by+20, 1, 12, '#7a5228');
      r(wx, by+25, 14, 1, '#7a5228');
      if(!night){ ctx.globalAlpha=.18; r(wx-4, by+16, 22, 20, '#ffd9a0'); ctx.globalAlpha=1; }
    }
    /* 门 + 暖帘 */
    r(bx+34, by+30, 16, 24, '#1a1210');
    for(var n=0;n<4;n++) r(bx+35+n*4, by+30, 3, 10, '#3d2a22');
    /* 灯笼 */
    lanterns(bx+4, by+16); lanterns(bx+bw-8, by+16);
  }
  function lanterns(x,y){
    var fl = 0.75 + 0.25*Math.sin(clock*0.006 + x);
    ctx.globalAlpha = .30*fl; r(x-6,y-2,20,16,P.lanternGlow);
    ctx.globalAlpha = 1;
    r(x, y, 8, 12, P.lantern);
    r(x+1, y+2, 6, 8, P.lantern2);
    r(x, y-2, 8, 2, '#1a1210');
    r(x+3, y+12, 2, 3, '#c9a05a');
    r(x, y+4, 8, 1, 'rgba(255,220,150,.35)');
  }

  /* ---------- 竹篱 ---------- */
  function fence(){
    var y = 118;
    for(var x=180;x<=236;x+=7){ r(x, y-16, 2, 18, P.fence); r(x, y-16, 2, 1, P.fenceLight); }
    r(178, y-10, 60, 2, P.fenceLight);
    r(178, y-2, 60, 2, P.fenceLight);
  }

  /* ---------- 汤池 ---------- */
  function pool(){
    /* 石台 / 地面 */
    r(0, 122, W, H-122, '#2a2320');
    /* 池子外圈石 */
    stoneRow(16, 124, 288, 6);
    /* 水面 */
    var wx0=26, wy0=130, ww=268, wh=40;
    r(wx0, wy0, ww, wh, P.water);
    for(var i=0;i<wh;i++){
      var t = i/wh;
      r(wx0, wy0+i, ww, 1, mix(P.water, P.water2, t));
    }
    /* 水面反光条纹 */
    for(var k=0;k<7;k++){
      var yy = wy0 + 5 + k*5;
      for(var x=wx0+6; x<wx0+ww-8; x+=1){
        if(((x + k*7 + Math.floor(clock*0.02)) % 23) < 5){
          ctx.globalAlpha = .5 - k*0.05;
          r(x, yy, 1, 1, P.ripple);
        }
      }
    }
    ctx.globalAlpha = 1;
    /* 旅馆灯火在水里的倒影 */
    for(var j=0;j<5;j++){
      ctx.globalAlpha = .10 + 0.04*Math.sin(clock*0.004 + j);
      r(wx0+ww-70+j*7, wy0+8+j*4, 16, 1, P.reflect);
    }
    ctx.globalAlpha = 1;
    /* 池边石头 */
    stoneRow(12, 128, 12, 26);
    stoneRow(296, 128, 14, 26);
    /* 前景石台边沿 */
    r(0, 170, W, 10, '#1f1a18');
    r(0, 168, W, 2, '#3a3029');
  }
  function stoneRow(x,y,w,h){
    var xx = x;
    while(xx < x+w){
      var bw = 6 + ((xx*7)%9);
      var bh = h + (((xx*5)%7) - 3);
      r(xx, y - bh + h, bw, bh, P.stone);
      r(xx, y - bh + h, bw, 1, P.stoneLit);
      r(xx, y - 1, bw, 1, P.stone3);
      xx += bw;
    }
  }

  /* ---------- 前景：木桶 / 毛巾 / 石头 ---------- */
  function props(){
    /* 木桶 */
    var bx=44, by=150;
    r(bx, by, 16, 12, P.wood2);
    r(bx, by, 16, 2, P.wood3);
    r(bx, by+5, 16, 1, P.wood);
    r(bx, by+10, 16, 2, P.wood);
    r(bx+2, by-3, 12, 4, '#e8e2d4');       /* 毛巾 */
    r(bx+2, by-3, 12, 1, '#fffaf0');
    /* 木盘 */
    r(268, 152, 26, 7, P.wood2);
    r(268, 152, 26, 1, P.wood3);
    r(272, 149, 18, 3, '#c9c2b2');
    /* 石头 */
    r(112, 158, 20, 8, P.stone2); r(112, 158, 20, 1, P.stoneLit);
    r(196, 160, 14, 6, P.stone2); r(196, 160, 14, 1, P.stoneLit);
  }

  /* ---------- 蒸汽 ---------- */
  var puffs = [];
  for(var i=0;i<16;i++){
    puffs.push({ x: 40 + Math.random()*240, y: 128 + Math.random()*34,
                 r: 2 + Math.random()*3, sp: 0.12 + Math.random()*0.18,
                 ph: Math.random()*Math.PI*2, a: 0.05 + Math.random()*0.06 });
  }
  function steam(){
    for(var i=0;i<puffs.length;i++){
      var p = puffs[i];
      p.y -= p.sp;
      p.x += Math.sin(clock*0.001 + p.ph) * 0.10;
      if(p.y < 96){ p.y = 156 + Math.random()*8; p.x = 40 + Math.random()*240; }
      var a = p.a * Math.min(1, (p.y-96)/26);
      ctx.globalAlpha = a;
      var rr = Math.round(p.r);
      r(p.x, p.y, rr+2, rr, 'rgb('+P.steam+')');
      r(p.x-1, p.y+1, rr, rr-1, 'rgb('+P.steam+')');
      r(p.x+1, p.y-1, rr, rr-1, 'rgb('+P.steam+')');
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 画面外的暖光晕 ---------- */
  function vignette(){
    var g = ctx.createRadialGradient(W*0.62, 120, 20, W*0.62, 120, 200);
    g.addColorStop(0, 'rgba(255,190,120,.10)');
    g.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    /* 四角压暗 */
    var v = ctx.createRadialGradient(W/2, H/2, 90, W/2, H/2, 210);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
  }

  var clock = 0;
  function frame(ts){
    clock = ts || 0;
    sky(); mountains(); bamboo(); inn(); fence(); pool(); props(); steam(); vignette();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.code === 'Space'){ night = !night; e.preventDefault(); }
  });
  cv.addEventListener('pointerdown', function(){ night = !night; });
})();
</script>
</body>
</html>
