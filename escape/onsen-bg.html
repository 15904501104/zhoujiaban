<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>温泉 · 背景预览</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a12;overflow:hidden;
    font-family:"Songti SC","STSong",serif;color:#cdbfa6}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 0 1px #2a2233,0 20px 60px rgba(0,0,0,.6)}
  #tag{position:fixed;left:16px;bottom:14px;font-size:12px;letter-spacing:.18em;opacity:.5}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="360"></canvas></div>
<div id="tag">温泉 · 320×180 → 放大预览（空格切换 黄昏 / 夜）</div>
<script>
window.onerror = function (m, s, l, c, e) {
  var d = document.getElementById('tag');
  if (d) {
    d.textContent = 'JS ERROR: ' + m + '  @line ' + l;
    d.style.color = '#ff6b6b'; d.style.opacity = 1; d.style.fontSize = '14px';
  }
  document.title = 'ERR ' + m;
};
(function(){
  var W = 320, H = 180;            /* 逻辑像素：和人物立绘同一颗粒度，放大 2×~4× 观看 */
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  function fit(){
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    s = Math.max(2, Math.floor(s));          /* 整数倍缩放，保持像素硬边 */
    cv.style.width = (W * s) + 'px';
    cv.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  /* ---------- 调色 ---------- */
  var P = {
    skyT:'#1b1426', skyM:'#3a2440', skyL:'#7b4038', glow:'#e59b58',
    mtnFar:'#3a2c46', mtnFar2:'#2c2338', snow:'#cfc7d6',
    mtnMid:'#241d31', mtnMid2:'#1b1626',
    bamboo:'#28331f', bamboo2:'#33421f', leaf:'#3d5127',
    roof:'#241a17', roofEdge:'#3a2a22', wall:'#5c4030', wall2:'#4a3327',
    win:'#e9b268', winDim:'#a97a44',
    lantern:'#b8362c', lantern2:'#e0503c', lanternGlow:'rgba(240,170,90,.25)',
    fence:'#3b3130', fenceLight:'#4e4038',
    stone:'#464150', stone2:'#575162', stone3:'#332f3c', stoneLit:'#6b6376',
    water:'#22333c', water2:'#2b4350', ripple:'#6f9aa4', reflect:'#c98d55',
    wood:'#3d2a1e', wood2:'#563b28', wood3:'#6d4a30',
    steam:'220,226,236'
  };
  var night = false;

  function r(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(x|0,y|0,w|0,h|0); }

  /* ---------- 背景：天空 ---------- */
  function sky(){
    var i, t;
    for(i=0;i<H;i++){
      t = i / H;
      var c;
      if(night){
        c = t < .55 ? mix('#0b0a16','#1a1730',t/.55) : mix('#1a1730','#2a2038',(t-.55)/.45);
      }else{
        c = t < .45 ? mix(P.skyT,P.skyM,t/.45) : mix(P.skyM,P.skyL,(t-.45)/.55);
      }
      r(0,i,W,1,c);
    }
    /* 星星 */
    var sp = [[23,12],[61,7],[88,19],[140,9],[173,15],[210,6],[248,17],[286,11],[304,22],[126,26],[39,24]];
    for(i=0;i<sp.length;i++){
      var a = night ? .85 : .35;
      ctx.globalAlpha = a * (0.55 + 0.45*Math.sin(clock*0.002 + i));
      r(sp[i][0], sp[i][1], 1, 1, '#fff4d8');
    }
    ctx.globalAlpha = 1;
    /* 落日 / 月亮 */
    if(night){
      ctx.globalAlpha=.9;
      for(i=0;i<9;i++){ r(262+i, 26-Math.round(Math.sin(i/8*Math.PI)*4), 1, 1, '#e8e2cf'); }
      ctx.globalAlpha=1;
    }else{
      ctx.globalAlpha=.5; r(246,30,26,10,P.glow); ctx.globalAlpha=.35; r(238,26,42,18,P.glow);
      ctx.globalAlpha=.9; r(252,32,14,7,'#ffd9a0'); ctx.globalAlpha=1;
    }
  }
  function mix(a,b,t){
    function hx(s){ return [parseInt(s.substr(1,2),16),parseInt(s.substr(3,2),16),parseInt(s.substr(5,2),16)]; }
    var A=hx(a), B=hx(b);
    return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';
  }

  /* ---------- 远山 ---------- */
  function mountains(){
    var i, y;
    /* 最远一层 */
    var far = [[0,96],[14,86],[26,90],[38,78],[52,84],[66,72],[80,80],[94,70],[108,78],
               [122,68],[136,76],[150,66],[164,74],[180,64],[196,74],[210,66],[226,76],
               [242,68],[258,78],[272,70],[288,80],[302,72],[316,82]];
    for(i=0;i<far.length-1;i++){
      var x0=far[i][0], y0=far[i][1], x1=far[i+1][0], y1=far[i+1][1];
      for(var x=x0;x<x1;x++){
        y = y0 + (y1-y0)*(x-x0)/(x1-x0);
        r(x, y, 1, 120-y, P.mtnFar);
        if(y<80){ r(x, y, 1, 2, P.snow); }
      }
    }
    /* 中景一层（更暗更近） */
    var mid = [[0,110],[20,100],[40,106],[58,96],[76,104],[96,92],[116,102],[134,94],
               [154,104],[172,96],[190,106],[208,98],[228,108],[246,100],[266,110],
               [284,102],[302,112],[320,104]];
    for(i=0;i<mid.length-1;i++){
      var a0=mid[i][0], b0=mid[i][1], a1=mid[i+1][0], b1=mid[i+1][1];
      for(var xx=a0;xx<a1;xx++){
        var yy = b0 + (b1-b0)*(xx-a0)/(a1-a0);
        r(xx, yy, 1, 130-yy, P.mtnMid);
      }
    }
  }

  /* ---------- 竹林 / 树影 ---------- */
  function bamboo(){
    var xs = [6,15,27,40,300,311,204,214,192];
    for(var i=0;i<xs.length;i++){
      var x = xs[i], h = 60 + (i%4)*10;
      var c = (i%2) ? P.bamboo : P.bamboo2;
      r(x, 118-h+40, 2, h, c);
      /* 竹节 */
      for(var k=8;k<h;k+=9){ r(x, 118-h+40+k, 2, 1, mix(c,'#000000',.35)); }
      /* 叶 */
      for(var j=0;j<4;j++){
        var ly = 60 + ((i*13+j*17)%34);
        r(x-3+(j%2)*4, ly, 3, 1, P.leaf);
        r(x+2-((j%2)*4), ly+3, 3, 1, P.leaf);
      }
    }
  }

  /* ---------- 温泉旅馆（中景右边） ---------- */
  function inn(){
    var bx = 228, by = 78, bw = 84, bh = 44;
    r(bx, by+10, bw, bh, P.wall);
    r(bx, by+10, bw, 3, P.wall2);
    /* 屋顶（两层出檐） */
    r(bx-6, by+4, bw+12, 7, P.roof);
    r(bx-3, by+2, bw+6, 3, P.roofEdge);
    r(bx-2, by+9, bw+4, 2, '#150f0d');
    /* 窗（暖光） */
    for(var i=0;i<3;i++){
      var wx = bx + 10 + i*24;
      r(wx, by+20, 14, 12, night ? P.winDim : P.win);
      r(wx, by+20, 14, 1, '#7a5228');
      r(wx+6, by+20, 1, 12, '#7a5228');
      r(wx, by+25, 14, 1, '#7a5228');
      if(!night){ ctx.globalAlpha=.18; r(wx-4, by+16, 22, 20, '#ffd9a0'); ctx.globalAlpha=1; }
    }
    /* 门 + 暖帘 */
    r(bx+34, by+30, 16, 24, '#1a1210');
    for(var n=0;n<4;n++) r(bx+35+n*4, by+30, 3, 10, '#3d2a22');
    /* 灯笼 */
    lanterns(bx+4, by+16); lanterns(bx+bw-8, by+16);
  }
  function lanterns(x,y){
    var fl = 0.75 + 0.25*Math.sin(clock*0.006 + x);
    ctx.globalAlpha = .30*fl; r(x-6,y-2,20,16,P.lanternGlow);
    ctx.globalAlpha = 1;
    r(x, y, 8, 12, P.lantern);
    r(x+1, y+2, 6, 8, P.lantern2);
    r(x, y-2, 8, 2, '#1a1210');
    r(x+3, y+12, 2, 3, '#c9a05a');
    r(x, y+4, 8, 1, 'rgba(255,220,150,.35)');
  }

  /* ---------- 竹篱 ---------- */
  function fence(){
    var y = 118;
    for(var x=180;x<=236;x+=7){ r(x, y-16, 2, 18, P.fence); r(x, y-16, 2, 1, P.fenceLight); }
    r(178, y-10, 60, 2, P.fenceLight);
    r(178, y-2, 60, 2, P.fenceLight);
  }

  /* ---------- 汤池 ---------- */
  function pool(){
    /* 石台 / 地面 */
    r(0, 122, W, H-122, '#2a2320');
    /* 池子外圈石 */
    stoneRow(16, 124, 288, 6);
    /* 水面 */
    var wx0=26, wy0=130, ww=268, wh=40;
    r(wx0, wy0, ww, wh, P.water);
    for(var i=0;i<wh;i++){
      var t = i/wh;
      r(wx0, wy0+i, ww, 1, mix(P.water, P.water2, t));
    }
    /* 水面反光条纹 */
    for(var k=0;k<7;k++){
      var yy = wy0 + 5 + k*5;
      for(var x=wx0+6; x<wx0+ww-8; x+=1){
        if(((x + k*7 + Math.floor(clock*0.02)) % 23) < 5){
          ctx.globalAlpha = .5 - k*0.05;
          r(x, yy, 1, 1, P.ripple);
        }
      }
    }
    ctx.globalAlpha = 1;
    /* 旅馆灯火在水里的倒影 */
    for(var j=0;j<5;j++){
      ctx.globalAlpha = .10 + 0.04*Math.sin(clock*0.004 + j);
      r(wx0+ww-70+j*7, wy0+8+j*4, 16, 1, P.reflect);
    }
    ctx.globalAlpha = 1;
    /* 池边石头 */
    stoneRow(12, 128, 12, 26);
    stoneRow(296, 128, 14, 26);
    /* 前景石台边沿 */
    r(0, 170, W, 10, '#1f1a18');
    r(0, 168, W, 2, '#3a3029');
  }
  function stoneRow(x,y,w,h){
    var xx = x;
    while(xx < x+w){
      var bw = 6 + ((xx*7)%9);
      var bh = h + (((xx*5)%7) - 3);
      r(xx, y - bh + h, bw, bh, P.stone);
      r(xx, y - bh + h, bw, 1, P.stoneLit);
      r(xx, y - 1, bw, 1, P.stone3);
      xx += bw;
    }
  }

  /* ---------- 前景：木桶 / 毛巾 / 石头 ---------- */
  function props(){
    /* 木桶 */
    var bx=44, by=150;
    r(bx, by, 16, 12, P.wood2);
    r(bx, by, 16, 2, P.wood3);
    r(bx, by+5, 16, 1, P.wood);
    r(bx, by+10, 16, 2, P.wood);
    r(bx+2, by-3, 12, 4, '#e8e2d4');       /* 毛巾 */
    r(bx+2, by-3, 12, 1, '#fffaf0');
    /* 木盘 */
    r(268, 152, 26, 7, P.wood2);
    r(268, 152, 26, 1, P.wood3);
    r(272, 149, 18, 3, '#c9c2b2');
    /* 石头 */
    r(112, 158, 20, 8, P.stone2); r(112, 158, 20, 1, P.stoneLit);
    r(196, 160, 14, 6, P.stone2); r(196, 160, 14, 1, P.stoneLit);
  }

  /* ---------- 蒸汽 ---------- */
  var puffs = [];
  for(var i=0;i<16;i++){
    puffs.push({ x: 40 + Math.random()*240, y: 128 + Math.random()*34,
                 r: 2 + Math.random()*3, sp: 0.12 + Math.random()*0.18,
                 ph: Math.random()*Math.PI*2, a: 0.05 + Math.random()*0.06 });
  }
  function steam(){
    for(var i=0;i<puffs.length;i++){
      var p = puffs[i];
      p.y -= p.sp;
      p.x += Math.sin(clock*0.001 + p.ph) * 0.10;
      if(p.y < 96){ p.y = 156 + Math.random()*8; p.x = 40 + Math.random()*240; }
      var a = p.a * Math.min(1, (p.y-96)/26);
      ctx.globalAlpha = a;
      var rr = Math.round(p.r);
      r(p.x, p.y, rr+2, rr, 'rgb('+P.steam+')');
      r(p.x-1, p.y+1, rr, rr-1, 'rgb('+P.steam+')');
      r(p.x+1, p.y-1, rr, rr-1, 'rgb('+P.steam+')');
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 画面外的暖光晕 ---------- */
  function vignette(){
    var g = ctx.createRadialGradient(W*0.62, 120, 20, W*0.62, 120, 200);
    g.addColorStop(0, 'rgba(255,190,120,.10)');
    g.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    /* 四角压暗 */
    var v = ctx.createRadialGradient(W/2, H/2, 90, W/2, H/2, 210);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
  }

  /* ---------- 新版：缩小的汤池 + 前景可走木台 ---------- */
  var POOL = { x0: 34, y0: 112, w: 252, h: 30 };   /* 水面 */
  function pool(){
    /* 前景木台（人可以走的地方） */
    r(0, 150, W, H-150, '#2b2521');
    for(var yy=154; yy<H; yy+=8){
      r(0, yy, W, 1, '#3a322c');
      r(0, yy+1, W, 1, '#221d19');
    }
    for(var xx=8; xx<W; xx+=26) r(xx, 150, 1, H-150, '#332b25');
    r(0, 148, W, 3, '#4a3e34');

    /* 池子（左中，收小） */
    stoneRow(POOL.x0-8, POOL.y0-4, POOL.w+16, 6);
    r(POOL.x0, POOL.y0, POOL.w, POOL.h, P.water);
    for(var i=0;i<POOL.h;i++){
      var t = i/POOL.h;
      r(POOL.x0, POOL.y0+i, POOL.w, 1, mix(P.water, P.water2, t));
    }
    for(var k=0;k<5;k++){
      var ry = POOL.y0 + 3 + k*5;
      for(var rx=POOL.x0+3; rx<POOL.x0+POOL.w-4; rx+=1){
        if(((rx + k*7 + Math.floor(clock*0.02)) % 17) < 4){
          ctx.globalAlpha = .45 - k*0.06;
          r(rx, ry, 1, 1, P.ripple);
        }
      }
    }
    ctx.globalAlpha = 1;
    for(var j=0;j<3;j++){
      ctx.globalAlpha = .10 + 0.04*Math.sin(clock*0.004 + j);
      r(POOL.x0+POOL.w-30+j*7, POOL.y0+5+j*4, 14, 1, P.reflect);
    }
    ctx.globalAlpha = 1;
    /* 池壁与下沿 */
    r(POOL.x0-10, POOL.y0-1, 4, POOL.h+6, P.stone2);
    r(POOL.x0-10, POOL.y0-1, 1, POOL.h+6, P.stoneLit);
    r(POOL.x0+POOL.w+6, POOL.y0-1, 4, POOL.h+6, P.stone2);
    r(POOL.x0+POOL.w+6, POOL.y0-1, 1, POOL.h+6, P.stoneLit);
    stoneRow(POOL.x0-8, POOL.y0+POOL.h+4, POOL.w+16, 5);
  }

  /* ---------- 三个人（吕奥 / 曹宇桓 / 张昊），半身泡在水里 ---------- */
  function person(cx, o){
    var x = cx - 11;
    var skin = o.skin, dk = mix(skin, '#000000', .16);
    /* 手臂搭在池沿 */
    r(x-4, 90, 4, 11, skin); r(x-4, 90, 1, 11, dk);
    r(x+19, 90, 4, 11, skin); r(x+22, 90, 1, 11, dk);
    /* 胸 / 肩 */
    r(x+1, 86, 20, 16, skin);
    r(x+1, 86, 20, 1, mix(skin, '#ffffff', .12));
    r(x+2, 90, 1, 10, mix(skin, '#ffffff', .10));      /* 胸肌高光 */
    r(x+18, 90, 1, 10, mix(skin, '#ffffff', .10));
    r(x+2, 98, 17, 1, dk); r(x+8, 98, 5, 1, mix(dk, '#000000', .3));
    /* 脖子 */
    r(x+8, 80, 6, 6, skin); r(x+8, 84, 6, 1, dk);
    /* 头 */
    r(x+4, 68, 14, 13, skin);
    r(x+4, 68, 14, 1, mix(skin, '#ffffff', .10));
    r(x+4, 80, 14, 1, dk);
    r(x+2, 72, 2, 4, skin); r(x+18, 72, 2, 4, skin);   /* 耳 */
    /* 五官 */
    r(x+7, 74, 2, 2, '#2a211c'); r(x+13, 74, 2, 2, '#2a211c');
    r(x+6, 73, 4, 1, mix(o.hair, '#000000', .25)); r(x+12, 73, 4, 1, mix(o.hair, '#000000', .25));
    r(x+10, 76, 2, 2, dk);                              /* 鼻 */
    r(x+8, 79, 3, 1, '#8a5348'); r(x+11, 79, 2, 1, '#8a5348');  /* 嘴 */
    /* 发型 */
    if(o.style === 'lvao'){
      r(x+3, 66, 16, 4, o.hair);
      r(x+3, 66, 16, 1, mix(o.hair, '#ffffff', .10));
      r(x+2, 68, 3, 14, o.hair); r(x+17, 68, 3, 14, o.hair);   /* 鬓角 */
      r(x+5, 69, 6, 2, o.hair);                                 /* 刘海斜分 */
      r(x+11, 70, 3, 2, o.hair);
      r(x+6, 68, 2, 1, mix(o.hair, '#ffffff', .18));
    }
    if(o.style === 'curly'){
      for(var i=0;i<9;i++){
        r(x+2+((i*5)%14), 62+(i%3)*3, 3, 3, o.hair);
      }
      r(x+3, 66, 16, 3, o.hair);
      r(x+1, 68, 3, 6, o.hair); r(x+18, 68, 3, 6, o.hair);
    }
    if(o.style === 'glasses'){
      for(var j=0;j<9;j++){ r(x+2+((j*7)%14), 62+(j%3)*3, 3, 3, o.hair); }
      r(x+3, 66, 16, 3, o.hair);
      r(x+1, 68, 3, 5, o.hair); r(x+18, 68, 3, 5, o.hair);
      /* 黑框眼镜 */
      r(x+6, 73, 4, 1, '#241d19'); r(x+12, 73, 4, 1, '#241d19');
      r(x+6, 76, 4, 1, '#241d19'); r(x+12, 76, 4, 1, '#241d19');
      r(x+6, 73, 1, 4, '#241d19'); r(x+9, 73, 1, 4, '#241d19');
      r(x+12, 73, 1, 4, '#241d19'); r(x+15, 73, 1, 4, '#241d19');
      r(x+10, 74, 2, 1, '#241d19');
    }
    /* 随身小物 */
    if(o.cig){ r(x+12, 79, 7, 1, '#f4f2ec'); r(x+19, 79, 2, 1, '#e07b3a'); }
    if(o.chain){
      for(var c=0;c<7;c++) r(x+7+c*1, 87+Math.round(Math.sin(c/1.6)*1), 1, 1, '#d8dde3');
      r(x+10, 90, 2, 2, '#e8edf2');
    }
  }
  var CAST = [
    { src:'sprites/zhanghao-bare.png?v=3', cx:108, name:'张昊', sink:0.74 },      /* 左：第二形态 */
    { src:'sprites/lvao.png',      cx:152, name:'吕奥' },              /* 中 */
    { src:'sprites/caoyuhuan.png', cx:196, name:'曹宇桓' }             /* 右 */
  ];
  /* 张昊 = 曹宇桓的身体（赤膊、有胸肌乳头、脖子齐全）横向压到 0.95
     + 张昊自己的头（只取到下巴 y=52，不带衣领）。
     0.95 之后身宽约 24..72：比吕奥(28..68)宽、比曹宇桓(22..74)窄。 */
  function bareOf(head, body){
    var c = document.createElement('canvas');
    c.width = 96; c.height = 120;
    var g = c.getContext('2d');
    g.imageSmoothingEnabled = false;

    var bw = 96 * 0.95, bx = 48 - bw / 2;

    /* 1) 身体（含脖子、胸肌、乳头、手臂） */
    g.drawImage(body, 0, 0, 96, 120, bx, 0, bw, 120);

    /* 2) 头（张昊，到下巴） */
    g.drawImage(head, 0, 0, 96, 52, 0, 0, 96, 52);

    /* 3) 脖子两侧补肤色，保证下巴到肩之间不断 */
    g.fillStyle = '#e9c6a4';
    g.fillRect(41, 44, 14, 9);        /* 颈柱 */
    g.fillRect(36, 50, 24, 4);        /* 颈根→斜方肌过渡 */
    g.fillStyle = 'rgba(150,110,82,.40)';
    g.fillRect(41, 52, 14, 1);        /* 颈下投影 */

    return c;
  }
  /* 两张图都到齐再合成（之前就是没等第二张，才画出一块底板） */
  function setBare(c){
    if(!(c.img && c.img.complete && c.img.naturalWidth)) return;
    if(!(c.bodyImg && c.bodyImg.complete && c.bodyImg.naturalWidth)) return;
    try{ c.cv = bareOf(c.img, c.bodyImg); }catch(e){}
  }
  for(var ci=0; ci<CAST.length; ci++){

  var GIRL = { img:new Image(), cx:205, name:'泳装少女' };

  GIRL2.img.src = 'girl2-art.png?v=1';
  var PS = 0.5;
  /* 张昊的「第二形态」：只把上衣换成赤裸上身，其余像素不动。
     全程只用 drawImage + fillRect，不读像素（该环境下读像素会抛 SecurityError）。 */
  function bareCanvas(src){
    var c = document.createElement('canvas');
    c.width = 96; c.height = 120;
    var g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(src, 0, 0);

    var SKIN='#e8c4a4', D='#d3a883', L='#f2d6bb',
        NIP='#c08872', NIPD='#a86f5c', NAV='#c09a7c', LN='#d8b394';

    g.fillStyle = SKIN;  g.fillRect(21, 55, 54, 42);   /* 躯干底 */
    g.fillStyle = D;     g.fillRect(43, 50, 11, 8);    /* 脖子暗 */
    g.fillStyle = SKIN;  g.fillRect(43, 50, 9, 8);
    g.fillStyle = L;     g.fillRect(22, 57, 52, 2);    /* 肩头亮 */
    g.fillStyle = D;     g.fillRect(21, 59, 3, 30);
    g.fillStyle = D;     g.fillRect(72, 59, 3, 30);
    g.fillStyle = D;     g.fillRect(21, 86, 54, 2);    /* 胸下影 */
    g.fillStyle = L;     g.fillRect(27, 63, 18, 1);
    g.fillStyle = L;     g.fillRect(51, 63, 18, 1);
    g.fillStyle = LN;    g.fillRect(27, 72, 17, 1);    /* 胸肌下缘 */
    g.fillRect(33, 73, 8, 1); g.fillRect(52, 72, 17, 1); g.fillRect(55, 73, 8, 1);
    g.fillStyle = D;     g.fillRect(47, 66, 2, 8);     /* 胸沟 */
    g.fillStyle = NIPD;  g.fillRect(34, 68, 3, 3);     /* 乳头 */
    g.fillStyle = NIP;   g.fillRect(35, 68, 1, 1);
    g.fillStyle = NIPD;  g.fillRect(59, 68, 3, 3);
    g.fillStyle = NIP;   g.fillRect(60, 68, 1, 1);
    g.fillStyle = D;     g.fillRect(47, 76, 1, 8);     /* 腹中线 */
    g.fillStyle = NAV;   g.fillRect(46, 88, 3, 2);     /* 肚脐 */
    g.fillStyle = D;     g.fillRect(46, 90, 3, 1);
    g.fillStyle = D;     g.fillRect(27, 74, 1, 16);
    g.fillRect(68, 74, 1, 16);
    g.fillStyle = SKIN;  g.fillRect(21, 94, 54, 2);
    return c;
  }
  function people(){
    var S = PS, sw = 96*S, sh = 120*S;
    var top = POOL2.cy - sh * 0.92;   /* 默认；张昊用 c.sink 单独下沉 */
    ctx.imageSmoothingEnabled = false;         /* 整数倍缩放，保持像素锐利（平滑会把眼睛糊掉） */
    for(var i=0;i<CAST.length;i++){
      var c = CAST[i];
      var ty = POOL2.cy - sh * (c.sink || 0.92);
      var dx = Math.round(c.cx - sw/2), dy = Math.round(ty);
      var W2 = Math.round(sw), H2 = Math.round(sh);
      var src = null;
      if(c.img.complete && c.img.naturalWidth){
        if(c.bare){
          if(!c.cv){ try{ c.cv = bareCanvas(c.img); }catch(e){ c.cv = c.img; } }
          src = c.cv;
        } else {
          src = c.img;
        }
      }
      if(src){
        ctx.drawImage(src, dx, dy, W2, H2);
      } else {

    }

  }

  /* 新人物：画在近侧（靠观众）池沿，水从身前盖下去（可复用多人） */
  function drawOne(g, cx, gs){
    if(!(g.img.complete && g.img.naturalWidth)) return;
    var GW = g.img.naturalWidth, GH = g.img.naturalHeight;
    var h2 = 62, w2 = Math.round(h2 * GW / GH);
    if(!g.cv || g.cv.width !== w2 || g.cv.height !== h2){
      g.cv = document.createElement('canvas');
      g.cv.width = w2; g.cv.height = h2;
      var c2 = g.cv.getContext('2d');
      c2.imageSmoothingEnabled = false;
      c2.drawImage(g.img, 0, 0, GW, GH, 0, 0, w2, h2);
    }
    var gy = Math.round(gs - h2 * 0.75);
    var gx = Math.round(cx - w2/2);
    ctx.imageSmoothingEnabled = false;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(POOL2.cx, POOL2.cy + 1, POOL2.rx, POOL2.ry, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(g.cv, gx, gy, w2, h2);

    var top0 = POOL2.cy - POOL2.ry * 0.55;
    var gr = ctx.createLinearGradient(0, top0, 0, POOL2.cy + POOL2.ry);
    gr.addColorStop(0, '#93dbe4');
    gr.addColorStop(0.55, '#6cc2cd');
    gr.addColorStop(1, '#4ba7b6');
    ctx.fillStyle = gr;
    ctx.fillRect(gx - 26, gs, w2 + 52, H - gs);
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#93dbe4';
    ctx.fillRect(gx, gs - 1, w2, 3);
    ctx.globalAlpha = 1;

    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#f4fbff';
    for(var dx2 = -13; dx2 <= 13; dx2 += 1){
      var wob2 = Math.sin(clock * 0.003 + dx2 * 0.45) * 0.9;
      ctx.fillRect(Math.round(cx + dx2), Math.round(gs + wob2), 1, 1);
    }
    ctx.globalAlpha = 0.22;
    for(var r3 = 1; r3 <= 3; r3++){
      var span2 = 14 + r3 * 4;
      for(var d3 = -span2; d3 <= span2; d3 += 2){
        if(Math.abs(d3) < 10) continue;
        var wob3 = Math.sin(clock * 0.0035 + d3 * 0.3 + r3) * (0.8 + r3 * 0.3);
        ctx.fillRect(Math.round(cx + d3), Math.round(gs + wob3 + r3 * 2), 1, 1);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawPlayer(){

    var x = Math.round(pl.x - sw / 2);

    /* 先用高质量降采样缓存到目标尺寸，再 1:1 贴上去，保住露出水面的细节 */
    if(!GIRL.cv || GIRL.cv.width !== w2 || GIRL.cv.height !== h2){

      g2.imageSmoothingEnabled = true;
      g2.imageSmoothingQuality = 'high';
      /* 先降一半再降一半，避免一次性大幅缩小糊成一片 */
      var mid = document.createElement('canvas');
      mid.width = Math.max(w2*2, GW/4|0); mid.height = Math.max(h2*2, GH/4|0);
      var m2 = mid.getContext('2d');
      m2.imageSmoothingEnabled = true; m2.imageSmoothingQuality = 'high';
      m2.drawImage(GIRL.img, 0, 0, mid.width, mid.height);

      ctx.translate(x + sw, 0); ctx.scale(-1, 1);

  /* ---------- 新版汤池：石砌不规则池 + 浅蓝水 + 水线泡沫 ---------- */
  var POOL2 = { cx: 160, cy: 122, rx: 116, ry: 30 };

  function poolEllipse(cx, cy, rx, ry, col){

  function pool2(){

      r(0, yy, W, 1, '#3a322c');
      r(0, yy + 1, W, 1, '#221d19');
    }
    r(0, 148, W, 3, '#4a3e34');

    /* 石砌外沿（比水面大一圈） */
    for(var i = 0; i < 46; i++){
      var a = i / 46 * Math.PI * 2;
      var bx = Math.round(POOL2.cx + Math.cos(a) * (POOL2.rx + 7));
      var by = Math.round(POOL2.cy + Math.sin(a) * (POOL2.ry + 7));
      var bw = 7 + (i % 3), bh = 5 + (i % 2);
      r(bx - (bw >> 1), by - (bh >> 1), bw, bh, (i % 4) ? P.stone2 : P.stone);
      r(bx - (bw >> 1), by - (bh >> 1), bw, 1, P.stoneLit);
    }

    /* 池水：浅蓝，上浅下深 */
    poolEllipse(POOL2.cx, POOL2.cy + 3, POOL2.rx + 3, POOL2.ry + 3, '#6f9fb2');
    var g = ctx.createLinearGradient(0, POOL2.cy - POOL2.ry, 0, POOL2.cy + POOL2.ry);
    g.addColorStop(0, '#a9d6e2');
    g.addColorStop(0.55, '#8dc3d4');
    g.addColorStop(1, '#5f93a8');
    poolEllipse(POOL2.cx, POOL2.cy + 1, POOL2.rx, POOL2.ry, g);

    /* 内壁反光 */
    ctx.globalAlpha = 0.35;
    poolEllipse(POOL2.cx, POOL2.cy - POOL2.ry * 0.45, POOL2.rx * 0.82, POOL2.ry * 0.34, '#d8f0f6');

  /* 水面：接续池水的深青渐变 + 细波纹 + 贴身的泡沫 */
  function waterCover2(){
    var top = POOL2.cy - POOL2.ry * 0.55;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(POOL2.cx, POOL2.cy + 1, POOL2.rx, POOL2.ry, 0, 0, Math.PI * 2);
    ctx.clip();

    /* 下半池的水：从水线颜色渐变到池底，和池水同色系，不是另一块色板 */
    var g = ctx.createLinearGradient(0, top, 0, POOL2.cy + POOL2.ry);
    g.addColorStop(0, '#93dbe4');
    g.addColorStop(0.55, '#6cc2cd');
    g.addColorStop(1, '#4ba7b6');
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, H - top);

    /* 细波纹：一组长、淡、错相的横线，随水缓慢位移 */
    for(var k = 0; k < 5; k++){
      var yy = top + 5 + k * 6;
      ctx.globalAlpha = 0.10 - k * 0.012;
      ctx.fillStyle = '#eafaff';
      for(var x = -20; x < W + 20; x += 1){
        var wob = Math.sin((x + clock * 0.02) * 0.045 + k * 1.7) * 1.6;
        ctx.fillRect(x, Math.round(yy + wob), 1, 1);
      }
    }

    /* 水面高光：靠近后沿的一条亮带 */
    ctx.globalAlpha = 0.26;
    ctx.fillStyle = '#f4fdff';
    ctx.beginPath();
    ctx.ellipse(POOL2.cx, top + 6, POOL2.rx * 0.72, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.restore();

    var RP = CAST.slice();
    if(typeof GIRL !== 'undefined' && GIRL && GIRL.img && GIRL.img.complete) RP.push(GIRL);
    for(var i = 0; i < RP.length; i++){
      var c = RP[i];
      var yy2 = top;
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#f4fbff';
      for(var dx = -13; dx <= 13; dx += 1){
        var wob2 = Math.sin(clock * 0.003 + dx * 0.45) * 0.9;
        ctx.fillRect(Math.round(c.cx + dx), Math.round(yy2 + wob2), 1, 1);
      }
      ctx.globalAlpha = 0.22;
      for(var r2 = 1; r2 <= 3; r2++){
        var span = 14 + r2 * 4;
        for(var d2 = -span; d2 <= span; d2 += 2){
          if(Math.abs(d2) < 10) continue;
          var wob3 = Math.sin(clock * 0.0035 + d2 * 0.3 + r2) * (0.8 + r2 * 0.3);
          ctx.fillRect(Math.round(c.cx + d2), Math.round(yy2 + wob3 + r2 * 2), 1, 1);
        }
      }
      ctx.globalAlpha = 1;

    ctx.fillStyle = SNOW;
    ctx.beginPath();
    ctx.ellipse(250, 92, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
  }

  function poolSnow(){
    /* 池沿石 + 雪 */
    for(var i = 0; i < 44; i++){
      var a = i / 44 * Math.PI * 2;
      var bx = Math.round(POOL2.cx + Math.cos(a) * (POOL2.rx + 6));
      var by = Math.round(POOL2.cy + Math.sin(a) * (POOL2.ry + 6));
      var bw = 8 + (i % 3), bh = 6 + (i % 2);
      r(bx - (bw >> 1), by - (bh >> 1), bw, bh, i % 4 ? '#7b7466' : '#8b8476');
      r(bx - (bw >> 1), by - (bh >> 1), bw, 2, SNOW);
    }
    /* 水 */
    var g = ctx.createLinearGradient(0, POOL2.cy - POOL2.ry, 0, POOL2.cy + POOL2.ry);
    g.addColorStop(0, WATER_L);
    g.addColorStop(0.5, WATER);
    g.addColorStop(1, '#4ba7b6');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(POOL2.cx, POOL2.cy, POOL2.rx, POOL2.ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function steamHeavy(){
    for(var i = 0; i < 22; i++){
      var ph = clock * 0.0006 + i * 1.7;
      var x = POOL2.cx + Math.sin(ph * 1.3) * (60 + (i % 5) * 8);
      var y = POOL2.cy - 6 - ((clock * 0.012 + i * 11) % 46);
      var rr = 6 + (i % 4) * 3;
      ctx.globalAlpha = 0.16 + 0.08 * Math.sin(ph * 2);
      ctx.fillStyle = '#f2f7fb';
      ctx.beginPath();
      ctx.ellipse(x, y, rr, rr * 0.62, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function snowFall(){
    for(var i = 0; i < 40; i++){
      var x = (i * 53 + clock * 0.012 * (1 + i % 3)) % W;
      var y = (i * 29 + clock * 0.02 * (1 + i % 4)) % 140;
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(i + clock * 0.002);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x | 0, y | 0, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  var clock = 0;
  function frame(ts){
    clock = ts || 0;
    snowSky(); snowBank(); bushRow(); lantern(); bigRock(); poolSnow(); steamHeavy(); people(); waterCover2(); drawGirl(); snowFall(); vignette();
    drawPrompt(); drawDialog(); hud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.code === 'Space'){ night = !night; e.preventDefault(); }
  });
  cv.addEventListener('pointerdown', function(){ night = !night; });
})();
</script>
