  body { transition: background-color .35s ease, color .35s ease; }

  .theme-btn {
    padding: 7px 18px; border: 0; border-radius: 999px; cursor: pointer;

    font-weight: 600; letter-spacing: .04em; opacity: .65; transition: all .25s ease;
  }
  .theme-btn[aria-pressed="true"] { opacity: 1; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .map-page { width: min(1280px, calc(100% - 48px)); }
  .map-shell {
    --sea: #dceaf7; --land: #ffffff; --stroke: #b6cfe6;
    --text: #1a1a1a; --pin: #e5484d; --pin-ring: rgba(229, 72, 77, .22);
    margin: 26px 0 0; padding: 18px; border-radius: 22px; background: var(--sea);
    box-shadow: 0 20px 50px rgba(18, 46, 80, .12);
    transition: background .35s ease, box-shadow .35s ease;
  }
  .map-shell[data-theme="night"] {
    --sea: #0c1c30; --land: #16283d; --stroke: #2f4c6b;
    --text: #e8eef7; --pin: #ff6b6b; --pin-ring: rgba(255, 107, 107, .25);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
  }
  .map-shell svg { display: block; width: 100%; height: auto; }
  .map-shell { cursor: zoom-in; touch-action: pan-y; }
  .map-shell.zoomed { cursor: grab; touch-action: none; }
  .map-shell.zoomed:active { cursor: grabbing; }
  .map-shell.zoomed {
    position: fixed; inset: 0; z-index: 9999; margin: 0; border-radius: 0;
    padding: clamp(12px, 2vw, 32px); cursor: zoom-out;
    display: flex; align-items: center; justify-content: center;
    background: var(--sea);
  }
  .map-shell.zoomed svg { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  .map-shell.zoomed .zoom-hint { opacity: 0; }
  .zoom-hint {
    position: absolute; right: 26px; bottom: 22px; padding: 6px 12px; border-radius: 999px;

    pointer-events: none; transition: opacity .25s ease;
  }
  body.embed .map-shell { position: relative; }
  .map-shell[data-theme="sat"] {
    --sea: #e9edf1;
    --land: transparent;
    --stroke: #b9c2cc;
    --text: #1d232a;
  }
  .day-layer { display: none; }
  .map-shell[data-theme="sat"] .day-layer { display: block; }
  .map-shell[data-theme="sat"] .land path { fill: transparent; stroke: none; }
  .map-shell[data-theme="sat"] .outline path { stroke: rgba(90, 72, 44, .85); stroke-width: .7; }
  .map-shell[data-theme="sat"] .day-layer { filter: drop-shadow(0 10px 16px rgba(30, 45, 60, .28)); }
  .map-shell[data-theme="sat"] .pin-label { stroke: rgba(255,255,255,.92); }
  .map-shell[data-theme="sat"] .pin-city { stroke: rgba(255,255,255,.92); opacity: .9; }
  .night-layer { display: none; }
  .map-shell[data-theme="night"] .night-layer { display: block; }
  .map-shell[data-theme="night"] .land path { fill: transparent; }
  .outline path { fill: none; stroke: var(--stroke); stroke-width: .7; stroke-linejoin: round; pointer-events: none; transition: stroke .35s ease; }
  .map-shell[data-theme="night"] .outline path { stroke: rgba(150, 190, 235, .55); }
  .map-shell .land path {
    fill: var(--land); stroke: var(--stroke); stroke-width: .7; stroke-linejoin: round;
    transition: fill .35s ease, stroke .35s ease;
  }
  .pin-dot { fill: var(--pin); }
  .pin-label {
    font-size: 12px; font-weight: 600; fill: var(--text);
    paint-order: stroke; stroke: rgba(255,255,255,.92); stroke-width: 3px; stroke-linejoin: round;
  }
  .map-shell[data-theme="night"] .pin-label { stroke: rgba(8,20,34,.9); }
  .pin-city {
    font-size: 9.5px; font-weight: 500; fill: var(--text); opacity: .66;
    paint-order: stroke; stroke: rgba(255,255,255,.92); stroke-width: 2.6px; stroke-linejoin: round;
  }
  .map-shell[data-theme="night"] .pin-city { stroke: rgba(8,20,34,.9); opacity: .8; }
  .pin-ring { transition: r .2s ease; }
  .pin:hover .pin-ring { r: 12; }
  .pin-ring { fill: var(--pin-ring); }
  .pin-label {
    fill: var(--text); font-size: 14px; font-weight: 600; paint-order: stroke;
    stroke: var(--land); stroke-width: 3px; stroke-linejoin: round;
    transition: fill .35s ease, stroke .35s ease;
  }
  .member-text .member-link {

  function merc(lat) {
    lat = Math.max(Math.min(lat, 85), -85);
    return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * 180 / Math.PI;
  }
  function project(lon, lat) {
    var s = VB.w / (LON1 - LON0);
    return { x: (lon - LON0) * s, y: (MY0 - merc(lat)) * s };
  }

  var MEMBERS = [

  function focusCity(p, sc) {
    sc = sc || 6;
    var nw = FULL.w / sc, nh = FULL.h / sc;
    view.w = nw; view.h = nh;
    view.x = p.x - nw / 2;
    view.y = p.y - nh / 2;
    clampView(); applyView(); syncPinScale();
    if (!shellElZ.classList.contains("zoomed")) setZoomed(true);
  }

  var pinNodes = [];

  function render() {
    var frag = document.createDocumentFragment();
    var placed = [];
    MEMBERS.forEach(function (m) {
      var md = project(m.lon, m.lat);
      placed.push({ x0: md.x - 11, y0: md.y - 11, x1: md.x + 11, y1: md.y + 11 });
    });
    MEMBERS.forEach(function (m) {
      var p = project(m.lon, m.lat);
      var w = Math.max(m.name.length * 13, m.city.length * 12) + 6;
      var h = 30;
      var cands = [
        { dx: 12, dy: 4, anchor: "start" },
        { dx: -12, dy: 4, anchor: "end" },
        { dx: 0, dy: -16, anchor: "middle" },
        { dx: 0, dy: 26, anchor: "middle" },
        { dx: 18, dy: 32, anchor: "start" },
        { dx: -18, dy: 32, anchor: "end" },
        { dx: 34, dy: -14, anchor: "start" },
        { dx: -34, dy: -14, anchor: "end" },
        { dx: 0, dy: -36, anchor: "middle" },
        { dx: 0, dy: 46, anchor: "middle" }
      ];
      var pick = cands[0];
      for (var i = 0; i < cands.length; i++) {
        var c = cands[i];
        var x0 = c.anchor === "start" ? p.x + c.dx : (c.anchor === "end" ? p.x + c.dx - w : p.x + c.dx - w / 2);
        var box = { x0: x0, y0: p.y + c.dy - h + 6, x1: x0 + w, y1: p.y + c.dy + 12 };
        var clash = placed.some(function (b) {
          return !(box.x1 < b.x0 || box.x0 > b.x1 || box.y1 < b.y0 || box.y0 > b.y1);
        });
        if (!clash) { pick = c; placed.push(box); break; }
      }

      var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "pin");
      g.style.cursor = "pointer";

      var ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      ring.setAttribute("class", "pin-ring");
      ring.setAttribute("cx", p.x.toFixed(1)); ring.setAttribute("cy", p.y.toFixed(1)); ring.setAttribute("r", "9");
      g.appendChild(ring);

      var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("class", "pin-dot");
      dot.setAttribute("cx", p.x.toFixed(1)); dot.setAttribute("cy", p.y.toFixed(1)); dot.setAttribute("r", "3.6");
      g.appendChild(dot);

      // label group: keeps a constant on-screen size by counter-scaling
      var lbl = document.createElementNS("http://www.w3.org/2000/svg", "g");
      lbl.setAttribute("class", "pin-label-group");
      lbl.setAttribute("transform", "translate(" + p.x.toFixed(1) + " " + p.y.toFixed(1) + ") scale(1)");

      var nameEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      nameEl.setAttribute("class", "pin-label");
      nameEl.setAttribute("text-anchor", pick.anchor);
      nameEl.setAttribute("x", pick.dx);
      nameEl.setAttribute("y", pick.dy);
      nameEl.textContent = m.name;
      lbl.appendChild(nameEl);

      var cityEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      cityEl.setAttribute("class", "pin-city");
      cityEl.setAttribute("text-anchor", pick.anchor);
      cityEl.setAttribute("x", pick.dx);
      cityEl.setAttribute("y", pick.dy + 15);
      cityEl.textContent = m.city;
      lbl.appendChild(cityEl);

      g.appendChild(lbl);

      var titleEl = document.createElementNS("http://www.w3.org/2000/svg", "title");
      titleEl.textContent = m.name + " · " + m.city;
      g.appendChild(titleEl);

      g.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
      g.addEventListener("click", function (ev) {
        ev.stopPropagation();
        focusCity(p, 6);
      });

      pinNodes.push({ g: g, ring: ring, dot: dot, lbl: lbl, p: p });
      frag.appendChild(g);
    });
    pins.appendChild(frag);
  }

  function buildPrint() {
    var el = document.getElementById("member-text");

  function syncPinScale() {
    var k = scaleOf();
    var inv = 1 / k;
    pinNodes.forEach(function (n) {
      n.lbl.setAttribute("transform", "translate(" + n.p.x.toFixed(1) + " " + n.p.y.toFixed(1) + ") scale(" + inv.toFixed(3) + ")");
      n.ring.setAttribute("r", (9 * inv).toFixed(2));
      n.dot.setAttribute("r", (3.6 * inv).toFixed(2));
    });
  }

  var shellElZ = document.getElementById("map-shell");
  var svg = document.getElementById("china-map");
  var FULL = { x: 0, y: 0, w: VB.w, h: VB.h };
  var view = { x: 0, y: 0, w: VB.w, h: VB.h };
  var MAXZ = 12;
  function scaleOf() { return FULL.w / view.w; }
  function applyView() {
    svg.setAttribute("viewBox", view.x.toFixed(2) + " " + view.y.toFixed(2) + " " + view.w.toFixed(2) + " " + view.h.toFixed(2));
  }
  function clampView() {
    var sc = Math.min(MAXZ, Math.max(1, scaleOf()));
    view.w = FULL.w / sc; view.h = FULL.h / sc;
    view.x = Math.min(FULL.w - view.w, Math.max(0, view.x));
    view.y = Math.min(FULL.h - view.h, Math.max(0, view.y));
  }
  function zoomAt(cx, cy, factor) {
    var r = svg.getBoundingClientRect();
    var fx = r.width ? (cx - r.left) / r.width : 0.5;
    var fy = r.height ? (cy - r.top) / r.height : 0.5;
    fx = Math.min(1, Math.max(0, fx)); fy = Math.min(1, Math.max(0, fy));
    var sc = Math.min(MAXZ, Math.max(1, scaleOf() * factor));
    var nw = FULL.w / sc, nh = FULL.h / sc;
    view.x += (view.w - nw) * fx;
    view.y += (view.h - nh) * fy;
    view.w = nw; view.h = nh;
    clampView(); applyView(); syncPinScale();
  }
  function resetView() { view = { x: 0, y: 0, w: FULL.w, h: FULL.h }; applyView(); syncPinScale(); }

  var pointers = new Map();
  var dragStart = null, pinchStart = null, moved = 0;

  function svgPoint(ev) {
    var r = svg.getBoundingClientRect();
    return { x: ev.clientX, y: ev.clientY, rx: r };
  }

  shellElZ.addEventListener("wheel", function (ev) {
    if (!shellElZ.classList.contains("zoomed")) return;
    ev.preventDefault();
    zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.0016));
  }, { passive: false });

  shellElZ.addEventListener("pointerdown", function (ev) {
    if (!shellElZ.classList.contains("zoomed")) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    moved = 0;
    if (pointers.size === 1) {
      dragStart = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y };
      shellElZ.setPointerCapture(ev.pointerId);
    } else if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      pinchStart = { d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), w: view.w };
      dragStart = null;
    }
  });

  shellElZ.addEventListener("pointermove", function (ev) {
    if (!pointers.has(ev.pointerId)) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pointers.size >= 2 && pinchStart) {
      var pts = Array.from(pointers.values());
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (d > 0) {
        var sc = Math.min(MAXZ, Math.max(1, FULL.w / (pinchStart.w * (pinchStart.d / d))));
        var nw = FULL.w / sc;
        var cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
        var r = svg.getBoundingClientRect();
        var fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;
        view.x += (view.w - nw) * Math.min(1, Math.max(0, fx));
        view.y += (view.h - FULL.h / sc) * Math.min(1, Math.max(0, fy));
        view.w = nw; view.h = FULL.h / sc;
        clampView(); applyView(); syncPinScale();
        moved = 99;
      }
      return;
    }
    if (dragStart) {
      var dx = ev.clientX - dragStart.x, dy = ev.clientY - dragStart.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
      var r2 = svg.getBoundingClientRect();
      if (r2.width && r2.height) {
        view.x = dragStart.vx - dx * (view.w / r2.width);
        view.y = dragStart.vy - dy * (view.h / r2.height);
        clampView(); applyView(); syncPinScale();
      }
    }
  });

  function endPointer(ev) {
    pointers.delete(ev.pointerId);
    if (pointers.size === 0) { dragStart = null; pinchStart = null; }
    if (pointers.size === 1) { pinchStart = null; var p = Array.from(pointers.values())[0]; dragStart = { x: p.x, y: p.y, vx: view.x, vy: view.y }; }
  }
  shellElZ.addEventListener("pointerup", endPointer);
  shellElZ.addEventListener("pointercancel", endPointer);

  shellElZ.addEventListener("dblclick", function (ev) {
    if (!shellElZ.classList.contains("zoomed")) return;
    ev.preventDefault(); resetView();
  });

  var shellEl = document.getElementById("map-shell");
  var embedded = document.body.classList.contains("embed");

  function setZoomed(on) {
    if (embedded && window.parent !== window) {
      try { window.parent.postMessage({ type: "zjban:map-zoom", on: !!on }, "*"); } catch (e) {}
      return;
    }
    shellEl.classList.toggle("zoomed", on);
    document.body.style.overflow = on ? "hidden" : "";
  }

  shellEl.addEventListener("click", function () {
    if (moved > 6) { moved = 0; return; }
    if (shellEl.classList.contains("zoomed") && scaleOf() > 1.02) { resetView(); }
    else { setZoomed(!shellEl.classList.contains("zoomed")); if (!shellEl.classList.contains("zoomed")) resetView(); }
  });
  shellEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setZoomed(!shellEl.classList.contains("zoomed")); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") setZoomed(false);
  });

  function apply(theme) {
    var night = theme === "night";
    var sat = theme === "sat";
    shell.setAttribute("data-theme", theme);
    document.body.classList.toggle("map-night", night);
    document.body.classList.toggle("map-sat", sat);
    document.body.style.background = night ? "#0a1421" : (sat ? "#f2f4f6" : "#ffffff");
    document.body.style.color = night ? "#e8eef7" : "#1d1d1f";
    buttons.forEach(function (b) {
      var on = b.getAttribute("data-theme") === theme;
      b.setAttribute("aria-pressed", String(on));
      b.style.background = on ? (night ? "#24405c" : "#ffffff") : "transparent";
      b.style.color = on ? (night ? "#ffffff" : "#111111") : (night ? "#9fb3c8" : "#5b6270");
    });
    try { localStorage.setItem("zjban.mapTheme", theme); } catch (e) {}
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () { apply(b.getAttribute("data-theme")); });
  });

  render();
  buildPrint();
  var saved = null;
  try { saved = localStorage.getItem("zjban.mapTheme"); } catch (e) {}
  apply(saved === "night" ? "night" : (saved === "day" ? "day" : "sat"));
})();
</script>
<script>
if (location.search.indexOf("embed") > -1) {
  document.body.classList.add("embed");
  var reportHeight = function () {
    var h = Math.ceil(document.body.getBoundingClientRect().height);
    try { parent.postMessage({ type: "zjban:map-height", h: h }, "*"); } catch (e) {}
  };
  window.addEventListener("load", function () { setTimeout(reportHeight, 60); });
  window.addEventListener("resize", function () { setTimeout(reportHeight, 120); });
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); }
}
</script>
<div class="pig-avatar" id="pig-avatar" hidden>
  <figure class="pig-avatar-box">
    <img alt="" decoding="async" loading="lazy">
    <figcaption></figcaption>
  </figure>
</div>
<script>
(function () {
  var modal = document.getElementById("pig-avatar");
  if (!modal) return;
  var img = modal.querySelector("img");
  var cap = modal.querySelector("figcaption");
  document.addEventListener("click", function (event) {
    var link = event.target.closest(".member-link");
    if (link) {
      img.src = link.getAttribute("data-photo");
      img.alt = link.getAttribute("data-name");
      cap.textContent = link.getAttribute("data-name");
      modal.hidden = false;
      event.stopPropagation();
      return;
    }
    if (event.target === modal) modal.hidden = true;
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") modal.hidden = true;
  });
})();
</script>
